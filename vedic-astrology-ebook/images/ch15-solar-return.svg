<text x="163.02586591405466" y="137.02586591405463" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Ta</text>
<line x1="197.0" y1="128.2" x2="180.0" y2="98.8" stroke="#3b2314"/>
<text x="218.16525745238994" y="105.1911233664446" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Ge</text>
<line x1="250.0" y1="114.0" x2="250.0" y2="80.0" stroke="#3b2314"/>
<text x="281.83474254761006" y="105.1911233664446" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Cn</text>
<line x1="303.0" y1="128.2" x2="320.0" y2="98.8" stroke="#3b2314"/>
<text x="336.97413408594537" y="137.02586591405466" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Le</text>
<line x1="341.8" y1="167.0" x2="371.2" y2="150.0" stroke="#3b2314"/>
<text x="368.8088766335554" y="192.16525745238994" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Vi</text>
<line x1="356.0" y1="220.0" x2="390.0" y2="220.0" stroke="#3b2314"/>
<text x="368.8088766335554" y="255.83474254761006" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Li</text>
<line x1="341.8" y1="273.0" x2="371.2" y2="290.0" stroke="#3b2314"/>
<text x="336.97413408594537" y="310.97413408594537" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Sc</text>
<line x1="303.0" y1="311.8" x2="320.0" y2="341.2" stroke="#3b2314"/>
<text x="281.83474254761006" y="342.8088766335554" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Sg</text>
<line x1="250.0" y1="326.0" x2="250.0" y2="360.0" stroke="#3b2314"/>
<text x="218.16525745238994" y="342.8088766335554" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Cp</text>
<line x1="197.0" y1="311.8" x2="180.0" y2="341.2" stroke="#3b2314"/>
<text x="163.02586591405466" y="310.97413408594537" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Aq</text>
<line x1="158.2" y1="273.0" x2="128.8" y2="290.0" stroke="#3b2314"/>
<text x="131.19112336644463" y="255.8347425476101" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">Pi</text>
<circle cx="292.4" cy="287.8" r="11" fill="#f59e0b" stroke="#3b2314"/>
<text x="292.39354113865636" y="291.8438476925141" text-anchor="middle" font-size="10" fill="#3b2314" font-weight="bold">Su</text>
<text x="290.39354113865636" y="315.8438476925141" text-anchor="middle" font-size="10" fill="#3b2314" font-style="italic">natal Sun, 28° Scorpio</text>
<polyline points="276.5,262.4 268.7,266.4 260.4,268.9 251.7,270.0 243.0,269.5 234.5,267.6 226.5,264.1 219.2,259.4 212.8,253.5 207.6,246.5 203.6,238.7 201.1,230.4 200.0,221.7 200.5,213.0 202.4,204.5 205.9,196.5 210.6,189.2 216.5,182.8 223.5,177.6 231.3,173.6 239.6,171.1 248.3,170.0 257.0,170.5 265.5,172.4 273.5,175.9 280.8,180.6 287.2,186.5 292.4,193.5 296.4,201.3 298.9,209.6 300.0,218.3 299.5,227.0 297.6,235.5 294.1,243.5 289.4,250.8 283.5,257.2" fill="none" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="282.1,258.3 272.1,252.3 272.1,264.3" fill="#7f1d1d" transform="rotate(500.0 282.1 258.3)"/>
<text x="250" y="214" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="bold">365¼ days later</text>
<text x="250" y="232" text-anchor="middle" font-size="11" fill="#7f1d1d">the Sun is back at 28° Scorpio</text>
<text x="470" y="110" text-anchor="start" font-size="12" fill="#3b2314">Varshaphal (Tajaka) casts a fresh chart</text>
<text x="470" y="130" text-anchor="start" font-size="12" fill="#3b2314">for the exact minute of that return,</text>
<text x="470" y="150" text-anchor="start" font-size="12" fill="#3b2314">every year, at the place the person lives.</text>
<text x="470" y="170" text-anchor="start" font-size="12" fill="#3b2314"></text>
<text x="470" y="190" text-anchor="start" font-size="12" fill="#3b2314">Its Lagna is the Varsha Lagna.</text>
<text x="470" y="210" text-anchor="start" font-size="12" fill="#3b2314">Its Moon, its Muntha and its year-lord</text>
<text x="470" y="230" text-anchor="start" font-size="12" fill="#3b2314">(Varshesha) colour the twelve months</text>
<text x="470" y="250" text-anchor="start" font-size="12" fill="#3b2314">until the next return.</text>
<text x="470" y="270" text-anchor="start" font-size="12" fill="#3b2314"></text>
<text x="470" y="290" text-anchor="start" font-size="12" fill="#3b2314" font-style="italic">The natal chart is the contract;</text>
<text x="470" y="310" text-anchor="start" font-size="12" fill="#3b2314" font-style="italic">the annual chart is that year's</text>
<text x="470" y="330" text-anchor="start" font-size="12" fill="#3b2314" font-style="italic">instalment.</text>
<text x="370.0" y="386" text-anchor="middle" font-size="11" fill="#3b2314" font-style="italic">The return happens within a day of the birthday, rarely on the exact calendar date and time.</text>
</svg>
