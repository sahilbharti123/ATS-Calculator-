<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="400" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">The solar return: the Sun comes home once a year</text>
<circle cx="250" cy="220" r="140" fill="none" stroke="#3b2314" stroke-width="2"/>
<circle cx="250" cy="220" r="106" fill="none" stroke="#3b2314" stroke-width="1"/>
