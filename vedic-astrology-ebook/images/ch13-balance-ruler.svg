<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="300" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#7f1d1d">Balance of the first dasha: how far the Moon has still to walk in its nakshatra</text>
<text x="52" y="96" text-anchor="end" font-size="12" fill="#7f1d1d" font-weight="bold" >Chart A</text>
<rect x="60" y="70" width="620" height="40" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<rect x="261.49999999999994" y="70" width="418.50000000000006" height="40" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.2"/>
<circle cx="261.49999999999994" cy="90" r="6" fill="#4b5563"/>
<text x="64" y="125" text-anchor="start" font-size="9.5" fill="#3b2314" >Ashlesha 16°40′ Cn starts</text>
<text x="680" y="125" text-anchor="end" font-size="9.5" fill="#3b2314" >ends 13°20′ later</text>
<text x="470.75" y="95" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold" >remaining 68% × 17 y (Mercury) = 11.5 y</text>
<text x="160.74999999999997" y="95" text-anchor="middle" font-size="10" fill="#3b2314" font-style="italic" >already walked</text>
<text x="52" y="171" text-anchor="end" font-size="12" fill="#7f1d1d" font-weight="bold" >Chart B</text>
<rect x="60" y="145" width="620" height="40" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<rect x="493.9999999999999" y="145" width="186.0000000000001" height="40" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.2"/>
<circle cx="493.9999999999999" cy="165" r="6" fill="#4b5563"/>
<text x="64" y="200" text-anchor="start" font-size="9.5" fill="#3b2314" >Krittika 26°40′ Ar starts</text>
<text x="680" y="200" text-anchor="end" font-size="9.5" fill="#3b2314" >ends 13°20′ later</text>
<text x="587.0" y="170" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold" >remaining 30% × 6 y (Sun) = 1.8 y</text>
<text x="276.99999999999994" y="170" text-anchor="middle" font-size="10" fill="#3b2314" font-style="italic" >already walked</text>
<text x="52" y="246" text-anchor="end" font-size="12" fill="#7f1d1d" font-weight="bold" >Chart C</text>
<rect x="60" y="220" width="620" height="40" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<rect x="75.50000000000003" y="220" width="604.5" height="40" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.2"/>
<circle cx="75.50000000000003" cy="240" r="6" fill="#4b5563"/>
<text x="64" y="275" text-anchor="start" font-size="9.5" fill="#3b2314" >P. Ashadha 13°20′ Sg starts</text>
<text x="680" y="275" text-anchor="end" font-size="9.5" fill="#3b2314" >ends 13°20′ later</text>
<text x="377.75" y="245" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold" >remaining 98% × 20 y (Venus) = 19.5 y</text>

<text x="370.0" y="290" text-anchor="middle" font-size="10.5" fill="#3b2314" font-style="italic" >Balance = (degrees left in the nakshatra ÷ 13°20′) × the lord’s years. The green part is what the child still has to live of that first dasha.</text>
</svg>