<text x="143.02229457658646" y="136.02229457658643" text-anchor="middle" font-size="10" fill="#7f1d1d">tithi 12</text>
<circle cx="130.0" cy="280.0" r="14" fill="#374151" stroke="#3b2314"/>
<circle cx="130.0" cy="280.0" r="14" fill="#fef3c7" stroke="#3b2314"/>
