<text x="143.0222945765864" y="436.97770542341357" text-anchor="middle" font-size="10" fill="#3b2314" font-weight="bold">Krishna Chaturthi (≈225°)</text>
<text x="143.0222945765864" y="449.97770542341357" text-anchor="middle" font-size="10" fill="#7f1d1d">tithi 19</text>
<circle cx="300.0" cy="450.0" r="14" fill="#374151" stroke="#3b2314"/>
<path d="M 300.0 436.0 A 14 14 0 0 1 300.0 464.0 Z" fill="#fef3c7"/>
<ellipse cx="300.0" cy="450.0" rx="0.0" ry="14" fill="#374151"/>
<text x="299.99999999999994" y="502.0" text-anchor="middle" font-size="10" fill="#3b2314" font-weight="bold">Krishna Ashtami</text>
<text x="299.99999999999994" y="515.0" text-anchor="middle" font-size="10" fill="#7f1d1d">270°</text>
<circle cx="420.2" cy="400.2" r="14" fill="#374151" stroke="#3b2314"/>
<path d="M 420.2 386.2 A 14 14 0 0 1 420.2 414.2 Z" fill="#fef3c7"/>
<ellipse cx="420.2" cy="400.2" rx="9.9" ry="14" fill="#374151"/>
<text x="456.9777054234135" y="436.97770542341357" text-anchor="middle" font-size="10" fill="#3b2314" font-weight="bold">Krishna Dwadashi (≈315°)</text>
<text x="456.9777054234135" y="449.97770542341357" text-anchor="middle" font-size="10" fill="#7f1d1d">tithi 27</text>
<path d="M 340 280 A 40 40 0 0 0 300 240" fill="none" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="338" y="250" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">90°</text>
<line x1="300" y1="258" x2="300" y2="124" stroke="#b8860b" stroke-width="1.5"/>
<text x="60" y="468" text-anchor="start" font-size="11" fill="#3b2314">One tithi = 12° of separation (360° ÷ 30). Moon ahead of Sun by 0–180° = bright half (Shukla); 180–360° = dark half (Krishna).</text>
<text x="60" y="486" text-anchor="start" font-size="11" fill="#3b2314">The Moon gains about 12° on the Sun each day, so a tithi lasts roughly a day — but between 20 and 27 hours, never exactly 24.</text>
<text x="370.0" y="508" text-anchor="middle" font-size="10" fill="#3b2314" font-style="italic">Not to scale. Phases as seen from Earth.</text>
</svg>
