<text x="456.97770542341357" y="136.02229457658646" text-anchor="middle" font-size="10" fill="#7f1d1d">tithi 4</text>
<circle cx="300.0" cy="110.0" r="14" fill="#374151" stroke="#3b2314"/>
<path d="M 300.0 96.0 A 14 14 0 0 1 300.0 124.0 Z" fill="#fef3c7"/>
<ellipse cx="300.0" cy="110.0" rx="0.0" ry="14" fill="#374151"/>
