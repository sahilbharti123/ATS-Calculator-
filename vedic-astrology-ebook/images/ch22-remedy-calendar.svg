<text x="38.0" y="250" text-anchor="start" font-size="12" fill="#3b2314">Day 1: begin in daylight, with a clear intention (sankalpa)</text>
<text x="38.0" y="272" text-anchor="start" font-size="12" fill="#b91c1c">Day 20 missed? The count is broken — as commonly taught, begin again from Day 1 (do not 'make up' the day)</text>
<text x="38.0" y="294" text-anchor="start" font-size="12" fill="#3b2314">Day 43 complete → stop; observe conduct rules afterwards. Some upay run 40 days instead — follow the text you use.</text>
<text x="380.0" y="326" text-anchor="middle" font-size="11" fill="#3b2314" font-style="italic">Colours: green = done, red = missed, gold = completion. The strip is an aid to memory, not a ritual object.</text>
