<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="Georgia, serif">
<rect x="0" y="0" width="740" height="330" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">Why the birth time matters: the Lagna changes about every two hours</text>
<rect x="40.0" y="90" width="220.0" height="50" fill="#fff" stroke="#3b2314" stroke-width="1.4"/>
<text x="150.0" y="111" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">Gemini Lagna</text>
<text x="150.0" y="130" text-anchor="middle" font-size="11" fill="#3b2314">≈ 17:45–19:50</text>
<rect x="260.0" y="90" width="220.0" height="50" fill="#fde68a" stroke="#3b2314" stroke-width="1.4"/>
<text x="370.0" y="111" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">Cancer Lagna</text>
<text x="370.0" y="130" text-anchor="middle" font-size="11" fill="#3b2314">≈ 19:50–22:00</text>
<rect x="480.0" y="90" width="220.0" height="50" fill="#fff" stroke="#3b2314" stroke-width="1.4"/>
<text x="590.0" y="111" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">Leo Lagna</text>
<text x="590.0" y="130" text-anchor="middle" font-size="11" fill="#3b2314">≈ 22:00–00:10</text>
<line x1="302.3076923076923" y1="76" x2="302.3076923076923" y2="154" stroke="#7f1d1d" stroke-width="2"/>
<text x="302.3076923076923" y="70" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="bold">mother remembers about 8 pm: 20:15</text>
<rect x="234.6153846153846" y="158" width="135.3846153846154" height="10" fill="#b8860b" opacity="0.5"/>
<text x="302.3076923076923" y="184" text-anchor="middle" font-size="10.5" fill="#3b2314">'about eight' = ±40 minutes: the band reaches back into Gemini: two candidate Lagnas, so the events must decide</text>
<text x="40" y="220" text-anchor="start" font-size="11.5" fill="#3b2314" font-weight="bold">Test the candidates against dated events:</text>
<text x="40" y="239" text-anchor="start" font-size="11.5" fill="#3b2314">• 2017–18 first job (Rahu/Jupiter): fits Cancer: Jupiter is the 9th lord in the 5th.</text>
<text x="40" y="258" text-anchor="start" font-size="11.5" fill="#3b2314">• 2022–24 'stuck' (Rahu/Mercury + Saturn over the 8th-house cluster): fits Cancer; with Gemini rising that cluster is the 9th and reads as travel and study.</text>
<text x="40" y="277" text-anchor="start" font-size="11.5" fill="#3b2314">• Body/temperament: rounder face, emotional memory, attachment to mother and home: Cancer, not the quick, wiry, talkative Gemini.</text>
<text x="40" y="296" text-anchor="start" font-size="11.5" fill="#3b2314">Record the time you chose and why. Rectification is an educated guess, and you must say so.</text>
<text x="370.0" y="316" text-anchor="middle" font-size="10.5" fill="#b8860b" font-style="italic">Times are illustrative for Pune, early March (sunset about 18:40); use your software's actual Lagna table.</text>
</svg>