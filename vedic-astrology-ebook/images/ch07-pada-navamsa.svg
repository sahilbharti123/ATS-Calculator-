<text x="370.0" y="278" text-anchor="middle" font-size="12" fill="#3b2314">Ashwini pada 1 = Aries Navamsa, pada 2 = Taurus … Krittika pada 1 = Sagittarius.</text>
<text x="370.0" y="298" text-anchor="middle" font-size="12" fill="#3b2314">Taurus continues the count: Krittika pada 2 = Capricorn (the 9th from Taurus, as the Navamsa rule says).</text>
<text x="370.0" y="320" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">108 padas around the zodiac = 9 full rounds of the 12 Navamsa signs.</text>
