<text x="370.0" y="400" text-anchor="middle" font-size="10.5" fill="#3b2314" font-style="italic" >Antardasha length = (Mahadasha years × sub-lord years) ÷ 120. Venus/Rahu = 20 × 18 ÷ 120 = 3 years.</text>
