<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="300" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">Tara Bala: the nine-fold count from your birth star</text>
<rect x="30.0" y="70" width="75.55555555555556" height="70" rx="4" fill="#e5e7eb" stroke="#3b2314" stroke-width="1.5"/>
<text x="67.77777777777777" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">1 Janma</text>
<text x="67.77777777777777" y="116" text-anchor="middle" font-size="11" fill="#3b2314">birth</text>
<text x="67.77777777777777" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">mixed</text>
<rect x="105.55555555555556" y="70" width="75.55555555555556" height="70" rx="4" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.5"/>
<text x="143.33333333333334" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">2 Sampat</text>
<text x="143.33333333333334" y="116" text-anchor="middle" font-size="11" fill="#3b2314">wealth</text>
<text x="143.33333333333334" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">good</text>
<rect x="181.11111111111111" y="70" width="75.55555555555556" height="70" rx="4" fill="#fecaca" stroke="#3b2314" stroke-width="1.5"/>
<text x="218.88888888888889" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">3 Vipat</text>
<text x="218.88888888888889" y="116" text-anchor="middle" font-size="11" fill="#3b2314">danger</text>
<text x="218.88888888888889" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">avoid</text>
<rect x="256.6666666666667" y="70" width="75.55555555555556" height="70" rx="4" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.5"/>
<text x="294.44444444444446" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">4 Kshema</text>
<text x="294.44444444444446" y="116" text-anchor="middle" font-size="11" fill="#3b2314">well-being</text>
<text x="294.44444444444446" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">good</text>
<rect x="332.22222222222223" y="70" width="75.55555555555556" height="70" rx="4" fill="#fecaca" stroke="#3b2314" stroke-width="1.5"/>
<text x="370.0" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">5 Pratyari</text>
<text x="370.0" y="116" text-anchor="middle" font-size="11" fill="#3b2314">obstacle</text>
<text x="370.0" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">avoid</text>
<rect x="407.77777777777777" y="70" width="75.55555555555556" height="70" rx="4" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.5"/>
<text x="445.55555555555554" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">6 Sadhaka</text>
<text x="445.55555555555554" y="116" text-anchor="middle" font-size="11" fill="#3b2314">achievement</text>
<text x="445.55555555555554" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">good</text>
<rect x="483.33333333333337" y="70" width="75.55555555555556" height="70" rx="4" fill="#fecaca" stroke="#3b2314" stroke-width="1.5"/>
<text x="521.1111111111112" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">7 Vadha</text>
<text x="521.1111111111112" y="116" text-anchor="middle" font-size="11" fill="#3b2314">harm</text>
<text x="521.1111111111112" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">avoid</text>
<rect x="558.8888888888889" y="70" width="75.55555555555556" height="70" rx="4" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.5"/>
<text x="596.6666666666667" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">8 Mitra</text>
<text x="596.6666666666667" y="116" text-anchor="middle" font-size="11" fill="#3b2314">friend</text>
<text x="596.6666666666667" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">good</text>
<rect x="634.4444444444445" y="70" width="75.55555555555556" height="70" rx="4" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.5"/>
<text x="672.2222222222223" y="96" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">9 Ati-Mitra</text>
<text x="672.2222222222223" y="116" text-anchor="middle" font-size="11" fill="#3b2314">great friend</text>
<text x="672.2222222222223" y="132" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">good</text>
<text x="370.0" y="170" text-anchor="middle" font-size="13" fill="#3b2314">Count from the birth nakshatra to the day's nakshatra (both included).</text>
<text x="370.0" y="190" text-anchor="middle" font-size="11" fill="#3b2314">If the count exceeds 9, subtract 9 (or 18). The remainder is the Tara; remainder 0 means the 9th, Ati-Mitra.</text>
<text x="370.0" y="220" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold">Worked example (Chart A, Moon in Ashlesha, star 9):</text>
<text x="370.0" y="242" text-anchor="middle" font-size="12" fill="#3b2314">Day's Moon in Hasta (star 13): count 9→13 = 5 → Pratyari (obstacle). Wait a day.</text>
<text x="370.0" y="262" text-anchor="middle" font-size="12" fill="#3b2314">Day's Moon in Chitra (star 14): count 9→14 = 6 → Sadhaka (achievement). Go ahead.</text>
<text x="370.0" y="288" text-anchor="middle" font-size="11" fill="#3b2314" font-style="italic">Green = favourable · Red = avoid for new beginnings · Grey = neutral, take care of health</text>
</svg>