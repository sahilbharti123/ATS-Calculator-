<text x="505.0" y="112.53333333333335" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="bold">Sa</text>
<text x="491.0" y="155.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">3</text>
<text x="554.0" y="230.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">4</text>
<text x="505.0" y="229.55" text-anchor="middle" font-size="13" fill="#4c1d95" font-weight="bold">Ra</text>
<text x="491.0" y="305.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">5</text>
<text x="463.3333333333333" y="304.2" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="bold">Maᴿ</text>
<text x="505.0" y="318.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">6</text>
<text x="580.0" y="259.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">7</text>
<text x="580.0" y="304.55" text-anchor="middle" font-size="13" fill="#b45309" font-weight="bold">Juᴿ</text>
<text x="655.0" y="318.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">8</text>
<text x="669.0" y="305.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">9</text>
<text x="696.6666666666667" y="304.2" text-anchor="middle" font-size="12" fill="#4b5563" font-weight="bold">Mo</text>
<text x="606.0" y="230.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">10</text>
<text x="655.0" y="229.55" text-anchor="middle" font-size="13" fill="#6b21a8" font-weight="bold">Ke</text>
<text x="669.0" y="155.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">11</text>
<text x="655.0" y="138.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">12</text>
<text x="655.0" y="112.53333333333335" text-anchor="middle" font-size="12" fill="#be185d" font-weight="bold">Ve</text>
<text x="580.0" y="410" text-anchor="middle" font-size="12" fill="#3b2314">Numbers = HOUSES only. No sign is read.</text>
<text x="580.0" y="426" text-anchor="middle" font-size="12" fill="#3b2314">House 1 = Sun's pakka ghar; Venus in 12 = Rahu's pakka ghar.</text>
<text x="380.0" y="454" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">Planets keep their Parashari house numbers; only the meaning of the frame changes.</text>
