<text x="269.0" y="305.0" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">4</text>
<text x="296.6666666666667" y="304.2" text-anchor="middle" font-size="12" fill="#4b5563" font-weight="bold">Mo</text>
<text x="206.0" y="230.0" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold">5</text>
