<text x="180.0" y="147.05" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="bold">Su</text>
<text x="180.0" y="162.05" text-anchor="middle" font-size="13" fill="#15803d" font-weight="bold">Me</text>
