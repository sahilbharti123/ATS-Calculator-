<text x="180.0" y="410" text-anchor="middle" font-size="12" fill="#3b2314">Gold numbers = SIGNS. The 1st house is Scorpio,</text>
<text x="180.0" y="426" text-anchor="middle" font-size="12" fill="#3b2314">so Mars colours the body; Venus sits in Libra, its own sign.</text>
<text x="580.0" y="62" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold">Lal Kitab chart — house 1 is always 'Aries'</text>
