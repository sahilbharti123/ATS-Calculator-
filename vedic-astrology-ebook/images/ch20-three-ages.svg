<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="300" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">The three classical spans of life (Ayurdaya): categories, not dates</text>
<rect x="50.0" y="90" width="204.8" height="60" fill="#fecaca" stroke="#3b2314" stroke-width="1.5"/>
<text x="152.4" y="116" text-anchor="middle" font-size="14" fill="#3b2314" font-weight="bold">Alpayu: short</text>
<text x="152.4" y="136" text-anchor="middle" font-size="12" fill="#7f1d1d">0–32</text>
<rect x="254.8" y="90" width="204.8" height="60" fill="#fde68a" stroke="#3b2314" stroke-width="1.5"/>
<text x="357.20000000000005" y="116" text-anchor="middle" font-size="14" fill="#3b2314" font-weight="bold">Madhyayu: medium</text>
<text x="357.20000000000005" y="136" text-anchor="middle" font-size="12" fill="#7f1d1d">32–64</text>
<rect x="459.6" y="90" width="230.4" height="60" fill="#bbf7d0" stroke="#3b2314" stroke-width="1.5"/>
<text x="574.8000000000001" y="116" text-anchor="middle" font-size="14" fill="#3b2314" font-weight="bold">Purnayu: full</text>
<text x="574.8000000000001" y="136" text-anchor="middle" font-size="12" fill="#7f1d1d">64–100 (some say 120)</text>
<line x1="50.0" y1="150" x2="50.0" y2="160" stroke="#3b2314"/>
<text x="50.0" y="176" text-anchor="middle" font-size="12" fill="#3b2314">0</text>
<line x1="254.8" y1="150" x2="254.8" y2="160" stroke="#3b2314"/>
<text x="254.8" y="176" text-anchor="middle" font-size="12" fill="#3b2314">32</text>
<line x1="459.6" y1="150" x2="459.6" y2="160" stroke="#3b2314"/>
<text x="459.6" y="176" text-anchor="middle" font-size="12" fill="#3b2314">64</text>
<line x1="690.0" y1="150" x2="690.0" y2="160" stroke="#3b2314"/>
<text x="690.0" y="176" text-anchor="middle" font-size="12" fill="#3b2314">100</text>
<text x="370.0" y="200" text-anchor="middle" font-size="13" fill="#3b2314">Judged from three pairs: Lagna lord &amp; 8th lord · Lagna sign &amp; Moon sign · Lagna &amp; Hora Lagna</text>
<text x="370.0" y="222" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">(movable / fixed / dual combinations: see the table in the chapter). Some texts use 36 / 72 as the boundaries.</text>
<text x="370.0" y="258" text-anchor="middle" font-size="12" fill="#7f1d1d" font-style="italic">Parashara himself calls this the hardest branch and warns against announcing death. The beginner says only:</text>
<text x="370.0" y="278" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold">“robust”, “average”, or “needs care”: and always: “keep up your check-ups.”</text>
</svg>