<text x="370.0" y="260" text-anchor="middle" font-size="11" fill="#3b2314" >Chart A: Sun 28° Scorpio (even) → Bala; Mars 4° Pisces (even) → Mrita; Venus 22° Libra (odd) → Vriddha; Moon 21° Cancer (even) → Kumara.</text>
<text x="370.0" y="280" text-anchor="middle" font-size="11" fill="#3b2314" font-style="italic" >Bala and Yuva give the fullest results; Vriddha gives little; Mrita gives almost nothing of its own: it borrows from its dispositor and dasha.</text>
