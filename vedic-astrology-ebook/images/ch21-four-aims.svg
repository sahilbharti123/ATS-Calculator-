<text x="433.3333333333333" y="180.0" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">11</text>
<text x="375.0" y="121.66666666666666" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">12</text>
<rect x="510" y="110" width="18" height="18" fill="#fecaca" stroke="#3b2314"/>
<text x="536" y="124" text-anchor="start" font-size="13" fill="#3b2314" font-weight="bold">Dharma (purpose)</text>
<text x="536" y="142" text-anchor="start" font-size="12" fill="#3b2314">houses 1, 5, 9</text>
<text x="536" y="158" text-anchor="start" font-size="11" fill="#3b2314" font-style="italic">fire houses</text>
<rect x="510" y="180" width="18" height="18" fill="#d9f99d" stroke="#3b2314"/>
<text x="536" y="194" text-anchor="start" font-size="13" fill="#3b2314" font-weight="bold">Artha (means)</text>
<text x="536" y="212" text-anchor="start" font-size="12" fill="#3b2314">houses 2, 6, 10</text>
<text x="536" y="228" text-anchor="start" font-size="11" fill="#3b2314" font-style="italic">earth houses</text>
<rect x="510" y="250" width="18" height="18" fill="#bae6fd" stroke="#3b2314"/>
<text x="536" y="264" text-anchor="start" font-size="13" fill="#3b2314" font-weight="bold">Kama (desire)</text>
<text x="536" y="282" text-anchor="start" font-size="12" fill="#3b2314">houses 3, 7, 11</text>
<text x="536" y="298" text-anchor="start" font-size="11" fill="#3b2314" font-style="italic">air houses</text>
<rect x="510" y="320" width="18" height="18" fill="#ddd6fe" stroke="#3b2314"/>
<text x="536" y="334" text-anchor="start" font-size="13" fill="#3b2314" font-weight="bold">Moksha (release)</text>
<text x="536" y="352" text-anchor="start" font-size="12" fill="#3b2314">houses 4, 8, 12</text>
<text x="536" y="368" text-anchor="start" font-size="11" fill="#3b2314" font-style="italic">water houses</text>
<text x="370.0" y="580" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">Each aim is a triangle of three houses, four signs apart — the same pattern as the elements in the natural zodiac.</text>
<text x="370.0" y="600" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">The spiritual questions of this chapter live in the Moksha triangle (4, 8, 12), with the 9th (dharma) as the door.</text>
<text x="370.0" y="620" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">Ketu, Jupiter and Saturn are its three karakas: release, guidance, renunciation.</text>
</svg>