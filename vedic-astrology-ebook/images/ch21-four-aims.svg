<line x1="480" y1="70" x2="60" y2="490" stroke="#3b2314" stroke-width="2"/>
<polygon points="270.0,70 480,280.0 270.0,490 60,280.0" fill="none" stroke="#3b2314" stroke-width="2"/>
<text x="270.0" y="180.0" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">1</text>
<text x="165.0" y="121.66666666666666" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">2</text>
<text x="106.66666666666666" y="180.0" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">3</text>
<text x="165.0" y="285.0" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">4</text>
<text x="106.66666666666666" y="390.0" text-anchor="middle" font-size="15" fill="#3b2314" font-weight="bold">5</text>
