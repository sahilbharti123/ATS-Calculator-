<svg xmlns="http://www.w3.org/2000/svg" width="740" height="760" viewBox="0 0 740 760" font-family="Georgia, serif">
<rect x="0" y="0" width="740" height="760" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">The written report: one page, seven sections</text>
<rect x="70" y="60" width="600" height="660" fill="#fff" stroke="#3b2314" stroke-width="1.5"/>
<rect x="78" y="68" width="584" height="644" fill="none" stroke="#b8860b" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="370.0" y="100" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="bold">KUNDALI READING — SUMMARY FOR ___________</text>
<text x="370.0" y="120" text-anchor="middle" font-size="10" fill="#3b2314" font-style="italic">Date of reading ____   Birth data used: __ / __ / ____, __:__ (source: ______), place ______</text>
<text x="370.0" y="134" text-anchor="middle" font-size="10" fill="#3b2314" font-style="italic">Rectified? yes / no   Ayanamsa: Lahiri   Confidential — prepared only for the person named above</text>
<rect x="94" y="146" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="160" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">1. The picture in five lines</text>
<text x="104" y="182" text-anchor="start" font-size="10.5" fill="#3b2314">Lagna and lord · Moon sign and nakshatra · strongest planet · weakest planet · one-line</text>
<text x="104" y="197" text-anchor="start" font-size="10.5" fill="#3b2314">temperament</text>
<line x1="104" y1="214" x2="636" y2="214" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<rect x="94" y="220" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="234" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">2. Your questions, one by one</text>
<text x="104" y="256" text-anchor="start" font-size="10.5" fill="#3b2314">Question → houses involved → what the chart suggests (tendency) → what favours you → what to</text>
<text x="104" y="271" text-anchor="start" font-size="10.5" fill="#3b2314">be careful about</text>
<line x1="104" y1="288" x2="636" y2="288" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<rect x="94" y="294" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="308" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">3. Timing</text>
<text x="104" y="330" text-anchor="start" font-size="10.5" fill="#3b2314">Current Mahadasha / Antardasha and dates · the next two sub-periods · Saturn &amp; Jupiter</text>
<text x="104" y="345" text-anchor="start" font-size="10.5" fill="#3b2314">transits · Sade Sati status · windows, not dates</text>
<line x1="104" y1="362" x2="636" y2="362" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<rect x="94" y="368" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="382" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">4. Strengths to lean on</text>
<text x="104" y="404" text-anchor="start" font-size="10.5" fill="#3b2314">Two or three placements that carry you, in plain words</text>
<line x1="104" y1="421" x2="636" y2="421" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<rect x="94" y="427" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="441" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">5. Tests to prepare for</text>
<text x="104" y="463" text-anchor="start" font-size="10.5" fill="#3b2314">One difficult truth, wrapped in a plan — never a threat</text>
<line x1="104" y1="480" x2="636" y2="480" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<rect x="94" y="486" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="500" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">6. Remedies (in order of importance)</text>
<text x="104" y="522" text-anchor="start" font-size="10.5" fill="#3b2314">Conduct → daan → mantra/fast → gemstone only if justified, with the reason and the</text>
<text x="104" y="537" text-anchor="start" font-size="10.5" fill="#3b2314">alternative</text>
<line x1="104" y1="554" x2="636" y2="554" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<rect x="94" y="560" width="552" height="20" fill="#fde68a" stroke="none"/>
<text x="100" y="574" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="bold">7. What to watch and when to return</text>
<text x="104" y="596" text-anchor="start" font-size="10.5" fill="#3b2314">Three things you predicted, with the window, so we can check together · follow-up date · "I</text>
<text x="104" y="611" text-anchor="start" font-size="10.5" fill="#3b2314">don't know" items</text>
<line x1="104" y1="628" x2="636" y2="628" stroke="#3b2314" stroke-width="0.5" stroke-dasharray="1,3"/>
<text x="370.0" y="698" text-anchor="middle" font-size="9.5" fill="#3b2314" font-style="italic">Astrology describes tendencies and timings; it is not medical, legal or financial advice. Decisions remain yours.</text>
<text x="370.0" y="746" text-anchor="middle" font-size="12" fill="#b8860b" font-style="italic">Two pages at most. If it cannot fit, it was not understood.</text>
</svg>