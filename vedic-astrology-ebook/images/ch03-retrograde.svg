<circle cx="397.4" cy="210.8" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="320.5" cy="78" r="5" fill="#b91c1c"/>
<text x="320.5" y="109.0" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#b91c1c">5</text>
<line x1="460.4" y1="342.5" x2="399.7" y2="170.6" stroke="#9ca3af" stroke-width="1"/>
