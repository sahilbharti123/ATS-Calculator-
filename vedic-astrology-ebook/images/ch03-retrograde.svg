<circle cx="380.0" cy="305.0" r="7" fill="#bae6fd" stroke="#4b5563" stroke-width="1.5"/>
<text x="380.0" y="325.0" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#4b5563">E4</text>
<circle cx="380.0" cy="210.0" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="380.0" y="200.0" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#b91c1c">M4</text>
