<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="760" height="520" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#7f1d1d">Retrograde motion: the Earth overtakes Mars on the inside lane</text>
<circle cx="380" cy="410" r="14" fill="#fbbf24" stroke="#c2410c" stroke-width="2"/>
<text x="380.0" y="440.0" text-anchor="middle" font-size="12" font-weight="normal" font-style="normal" fill="#3b2314">Sun</text>
