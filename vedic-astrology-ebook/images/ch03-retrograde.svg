<text x="380.0" y="130.0" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#7f1d1d">Apparent path against the stars: 1 → 2 forward; 2 → 6 backwards (retrograde), fastest near 4; 6 → 7 forward again</text>
<text x="380.0" y="466.0" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#3b2314">Seven moments about a month apart (E = Earth, M = Mars). Both move the same way round the Sun,</text>
<text x="380.0" y="482.0" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#3b2314">but Earth is faster and passes Mars at moment 4, so our line of sight swings back for a while.</text>
<text x="380.0" y="498.0" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#3b2314">Nothing in the sky reverses; only the viewing angle changes.</text>
</svg>