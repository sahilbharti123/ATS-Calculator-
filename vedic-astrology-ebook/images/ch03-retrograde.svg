<circle cx="335.6" cy="314.8" r="7" fill="#bae6fd" stroke="#4b5563" stroke-width="1.5"/>
<text x="335.6" y="334.8" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#4b5563">E3</text>
<circle cx="362.6" cy="210.8" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="439.5" cy="78" r="5" fill="#b91c1c"/>
<text x="439.5" y="109.0" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#b91c1c">3</text>
