<svg xmlns="http://www.w3.org/2000/svg" width="740" height="560" viewBox="0 0 740 560" font-family="Georgia, serif">
<rect x="0" y="0" width="740" height="560" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">The eleven-step reading template (photocopy this card)</text>
<rect x="30" y="54" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="73" r="13" fill="#7f1d1d"/>
<text x="52" y="77.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
<text x="74" y="71" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Birth data, chart, planetary table</text>
<text x="74" y="86" text-anchor="start" font-size="10.5" fill="#3b2314">sign · degree · house · nakshatra/pada · dignity · retro/combust</text>
<rect x="30" y="96" width="680" height="38" rx="6" fill="#fde68a" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="115" r="13" fill="#7f1d1d"/>
<text x="52" y="119.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
<text x="74" y="113" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Three pillars</text>
<text x="74" y="128" text-anchor="start" font-size="10.5" fill="#3b2314">Lagna + lord · Moon (sign, star, strength) · Sun</text>
<rect x="30" y="138" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="157" r="13" fill="#7f1d1d"/>
<text x="52" y="161.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
<text x="74" y="155" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Functional benefics / malefics</text>
<text x="74" y="170" text-anchor="start" font-size="10.5" fill="#3b2314">from the Lagna table (Ch 8, A.6): the traffic lights</text>
<rect x="30" y="180" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="199" r="13" fill="#7f1d1d"/>
<text x="52" y="203.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
<text x="74" y="197" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">House walk 1 → 12</text>
<text x="74" y="212" text-anchor="start" font-size="10.5" fill="#3b2314">five steps each: house · lord · karaka · same house from Moon · varga</text>
<rect x="30" y="222" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="241" r="13" fill="#7f1d1d"/>
<text x="52" y="245.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">5</text>
<text x="74" y="239" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Yogas present</text>
<text x="74" y="254" text-anchor="start" font-size="10.5" fill="#3b2314">name them, then ask: are their planets strong enough to deliver?</text>
<rect x="30" y="264" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="283" r="13" fill="#7f1d1d"/>
<text x="52" y="287.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">6</text>
<text x="74" y="281" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Navamsa (D9) quick read</text>
<text x="74" y="296" text-anchor="start" font-size="10.5" fill="#3b2314">D9 Lagna · Vargottama planets · D9 dignity of the 7th lord and Lagna lord</text>
<rect x="30" y="306" width="680" height="38" rx="6" fill="#fde68a" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="325" r="13" fill="#7f1d1d"/>
<text x="52" y="329.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">7</text>
<text x="74" y="323" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Dasha timeline</text>
<text x="74" y="338" text-anchor="start" font-size="10.5" fill="#3b2314">Mahadasha/Antardasha dates · confirm 2–3 past events · current · next 3–5 years with double transit</text>
<rect x="30" y="348" width="680" height="38" rx="6" fill="#fde68a" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="367" r="13" fill="#7f1d1d"/>
<text x="52" y="371.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">8</text>
<text x="74" y="365" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">The client's questions</text>
<text x="74" y="380" text-anchor="start" font-size="10.5" fill="#3b2314">map each to its houses, karaka, lord, dasha: answer as tendency + window</text>
<rect x="30" y="390" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="409" r="13" fill="#7f1d1d"/>
<text x="52" y="413.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">9</text>
<text x="74" y="407" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Remedies</text>
<text x="74" y="422" text-anchor="start" font-size="10.5" fill="#3b2314">strengthen functional benefics; pacify malefics by conduct/daan; gem only if justified</text>
<rect x="30" y="432" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="451" r="13" fill="#7f1d1d"/>
<text x="52" y="455.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">10</text>
<text x="74" y="449" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">The first two minutes</text>
<text x="74" y="464" text-anchor="start" font-size="10.5" fill="#3b2314">the script: warm, specific, two strengths, one caution, a plan</text>
<rect x="30" y="474" width="680" height="38" rx="6" fill="#fff" stroke="#3b2314" stroke-width="1"/>
<circle cx="52" cy="493" r="13" fill="#7f1d1d"/>
<text x="52" y="497.5" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">11</text>
<text x="74" y="491" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold">Lessons / log entry</text>
<text x="74" y="506" text-anchor="start" font-size="10.5" fill="#3b2314">what you predicted, the window, when to check</text>
<text x="370.0" y="546" text-anchor="middle" font-size="12" fill="#b8860b" font-style="italic">Shaded rows are where beginners rush. Slow down there.</text>
</svg>