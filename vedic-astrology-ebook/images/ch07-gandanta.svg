<text x="370.0" y="300" text-anchor="middle" font-size="11" fill="#3b2314">A water sign ends in Mercury's star; a fire sign begins in Ketu's star. The 6°40′ strip across the join is Gandanta.</text>
<text x="370.0" y="320" text-anchor="middle" font-size="11" fill="#3b2314">Check the Moon and Lagna here. Chart A's Moon at 21° Cancer is in Ashlesha but NOT in the knot (it starts at 26°40′).</text>
