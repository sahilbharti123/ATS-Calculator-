<svg xmlns="http://www.w3.org/2000/svg" width="740" height="470" viewBox="0 0 740 470" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="470" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">Why the weekdays run Sun–Mon–Tue…: the seven-pointed star</text>
<circle cx="250" cy="260" r="150" fill="none" stroke="#b8860b" stroke-width="1.5"/>
<line x1="250.0" y1="110.0" x2="315.1" y2="395.1" stroke="#7f1d1d" stroke-width="2"/>
<line x1="367.3" y1="166.5" x2="184.9" y2="395.1" stroke="#7f1d1d" stroke-width="2"/>
<line x1="396.2" y1="293.4" x2="103.8" y2="293.4" stroke="#7f1d1d" stroke-width="2"/>
<line x1="315.1" y1="395.1" x2="132.7" y2="166.5" stroke="#7f1d1d" stroke-width="2"/>
<line x1="184.9" y1="395.1" x2="250.0" y2="110.0" stroke="#7f1d1d" stroke-width="2"/>
<line x1="103.8" y1="293.4" x2="367.3" y2="166.5" stroke="#7f1d1d" stroke-width="2"/>
<line x1="132.7" y1="166.5" x2="396.2" y2="293.4" stroke="#7f1d1d" stroke-width="2"/>
<circle cx="250.0" cy="110.0" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="250.0" y="114.0" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Sa</text>
<text x="250.0" y="68.0" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Saturn</text>
<text x="250.0" y="81.0" text-anchor="middle" font-size="10" fill="#7f1d1d">Saturday</text>
<circle cx="367.3" cy="166.5" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="367.2747223702045" y="170.47652972119" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Ju</text>
<text x="400.1116446338617" y="140.28995804312316" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Jupiter</text>
<text x="400.1116446338617" y="153.28995804312316" text-anchor="middle" font-size="10" fill="#7f1d1d">Thursday</text>
<circle cx="396.2" cy="293.4" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="396.23918682727356" y="297.3781400934472" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Ma</text>
<text x="437.18615913891017" y="302.72401931961235" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Mars</text>
<text x="437.18615913891017" y="315.72401931961235" text-anchor="middle" font-size="10" fill="#7f1d1d">Tuesday</text>
<circle cx="315.1" cy="395.1" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="315.08256086763373" y="399.14533018536287" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Su</text>
<text x="333.3056779105712" y="432.98602263726445" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Sun</text>
<text x="333.3056779105712" y="445.98602263726445" text-anchor="middle" font-size="10" fill="#7f1d1d">Sunday</text>
<circle cx="184.9" cy="395.1" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="184.9174391323663" y="399.14533018536287" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Ve</text>
<text x="166.69432208942885" y="432.98602263726445" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Venus</text>
<text x="166.69432208942885" y="445.98602263726445" text-anchor="middle" font-size="10" fill="#7f1d1d">Friday</text>
<circle cx="103.8" cy="293.4" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="103.76081317272644" y="297.3781400934471" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Me</text>
<text x="62.81384086108983" y="302.7240193196123" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Mercury</text>
<text x="62.81384086108983" y="315.7240193196123" text-anchor="middle" font-size="10" fill="#7f1d1d">Wednesday</text>
<circle cx="132.7" cy="166.5" r="20" fill="#fffaf0" stroke="#3b2314" stroke-width="1.5"/>
<text x="132.72527762979553" y="170.47652972119" text-anchor="middle" font-size="12" fill="#3b2314" font-weight="bold">Mo</text>
<text x="99.88835536613826" y="140.2899580431232" text-anchor="middle" font-size="11" fill="#3b2314" font-weight="bold">Moon</text>
<text x="99.88835536613826" y="153.2899580431232" text-anchor="middle" font-size="10" fill="#7f1d1d">Monday</text>
<text x="490" y="80" text-anchor="start" font-size="12" fill="#3b2314">Around the circle: the planets in order of</text>
<text x="490" y="100" text-anchor="start" font-size="12" fill="#3b2314">speed, slowest first — Saturn, Jupiter, Mars,</text>
<text x="490" y="120" text-anchor="start" font-size="12" fill="#3b2314">Sun, Venus, Mercury, Moon (the Chaldean order).</text>
<text x="490" y="140" text-anchor="start" font-size="12" fill="#3b2314"></text>
<text x="490" y="160" text-anchor="start" font-size="12" fill="#3b2314">Each hour (hora) of the day is ruled by the next</text>
<text x="490" y="180" text-anchor="start" font-size="12" fill="#3b2314">planet in this circle. Sunday's first hora is the</text>
<text x="490" y="200" text-anchor="start" font-size="12" fill="#3b2314">Sun's. 24 hours later, three steps on, the 25th</text>
<text x="490" y="220" text-anchor="start" font-size="12" fill="#3b2314">hora — Monday's first — belongs to the Moon.</text>
<text x="490" y="240" text-anchor="start" font-size="12" fill="#3b2314"></text>
<text x="490" y="260" text-anchor="start" font-size="12" fill="#3b2314">Follow the star from point to point, skipping</text>
<text x="490" y="280" text-anchor="start" font-size="12" fill="#3b2314">two each time, and you read the week:</text>
<text x="490" y="300" text-anchor="start" font-size="12" fill="#3b2314">Sun → Moon → Mars → Mercury → Jupiter →</text>
<text x="490" y="320" text-anchor="start" font-size="12" fill="#3b2314">Venus → Saturn → Sun again.</text>
<text x="370.0" y="456" text-anchor="middle" font-size="11" fill="#3b2314" font-style="italic">Every ancient culture that used the seven-day week inherited this same star.</text>
</svg>
