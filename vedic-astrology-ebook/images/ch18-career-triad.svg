<svg xmlns="http://www.w3.org/2000/svg" width="740" height="520" viewBox="0 0 740 520" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="520" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#7f1d1d">The career triad: three questions, three sets of houses</text>
<circle cx="275" cy="215" r="120" fill="#fde68a" fill-opacity="0.75" stroke="#3b2314" stroke-width="2"/>
<circle cx="465" cy="215" r="120" fill="#bbf7d0" fill-opacity="0.75" stroke="#3b2314" stroke-width="2"/>
<circle cx="370" cy="360" r="120" fill="#bfdbfe" fill-opacity="0.75" stroke="#3b2314" stroke-width="2"/>
<text x="220" y="165" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">WHAT YOU DO</text>
<text x="220" y="185" text-anchor="middle" font-size="13" fill="#3b2314">10th house (karma)</text>
<text x="220" y="203" text-anchor="middle" font-size="12" fill="#3b2314">10th lord, its sign</text>
<text x="220" y="221" text-anchor="middle" font-size="12" fill="#3b2314">planets in the 10th</text>
<text x="220" y="239" text-anchor="middle" font-size="12" fill="#3b2314">10th from Moon &amp; Sun</text>
<text x="520" y="165" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">WHAT YOU EARN</text>
<text x="520" y="185" text-anchor="middle" font-size="13" fill="#3b2314">2nd house (kept wealth)</text>
<text x="520" y="203" text-anchor="middle" font-size="13" fill="#3b2314">11th house (gains)</text>
<text x="520" y="221" text-anchor="middle" font-size="12" fill="#3b2314">Jupiter (wealth karaka)</text>
<text x="520" y="239" text-anchor="middle" font-size="12" fill="#3b2314">Dhana yogas, D2 Hora</text>
<text x="370" y="400" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold">HOW YOU SERVE</text>
<text x="370" y="420" text-anchor="middle" font-size="13" fill="#3b2314">6th house = job, service, competition</text>
<text x="370" y="438" text-anchor="middle" font-size="13" fill="#3b2314">7th house = business, partnership, the public</text>
<text x="370" y="245" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">The</text>
<text x="370" y="262" text-anchor="middle" font-size="13" fill="#3b2314" font-weight="bold">profession</text>
<text x="370" y="279" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">lives where</text>
<text x="370" y="296" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">all three meet</text>
<text x="370.0" y="480" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">A strong 10th with a weak 2nd = famous but not rich. A strong 2nd/11th with a weak 10th = money without a title.</text>
<text x="370.0" y="500" text-anchor="middle" font-size="12" fill="#3b2314" font-style="italic">Read all three before you name a profession.</text>
</svg>