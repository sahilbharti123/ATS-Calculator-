<text x="370.0" y="236" text-anchor="middle" font-size="11" fill="#3b2314" font-style="italic">Testing periods: Ulka (Saturn) and Sankata (Rahu). Rewarding: Dhanya (Jupiter) and Siddha (Venus).</text>
