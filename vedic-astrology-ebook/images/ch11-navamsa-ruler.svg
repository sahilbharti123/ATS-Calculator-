<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="740" height="330" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
<text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#7f1d1d">One sign, nine Navamsa slices of 3°20′ each</text>
<rect x="40.0" y="70" width="73.33333333333333" height="46" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<text x="76.66666666666666" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >1</text>
<text x="76.66666666666666" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+0</text>
<rect x="113.33333333333333" y="70" width="73.33333333333333" height="46" fill="#fffaf0" stroke="#3b2314" stroke-width="1.2"/>
<text x="150.0" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >2</text>
<text x="150.0" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+1</text>
<rect x="186.66666666666666" y="70" width="73.33333333333333" height="46" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<text x="223.33333333333331" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >3</text>
<text x="223.33333333333331" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+2</text>
<rect x="260.0" y="70" width="73.33333333333333" height="46" fill="#fffaf0" stroke="#3b2314" stroke-width="1.2"/>
<text x="296.6666666666667" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >4</text>
<text x="296.6666666666667" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+3</text>
<rect x="333.3333333333333" y="70" width="73.33333333333333" height="46" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<text x="370.0" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >5</text>
<text x="370.0" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+4</text>
<rect x="406.66666666666663" y="70" width="73.33333333333333" height="46" fill="#fffaf0" stroke="#3b2314" stroke-width="1.2"/>
<text x="443.3333333333333" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >6</text>
<text x="443.3333333333333" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+5</text>
<rect x="480.0" y="70" width="73.33333333333333" height="46" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<text x="516.6666666666666" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >7</text>
<text x="516.6666666666666" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+6</text>
<rect x="553.3333333333333" y="70" width="73.33333333333333" height="46" fill="#fffaf0" stroke="#3b2314" stroke-width="1.2"/>
<text x="589.9999999999999" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >8</text>
<text x="589.9999999999999" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+7</text>
<rect x="626.6666666666666" y="70" width="73.33333333333333" height="46" fill="#fde68a" stroke="#3b2314" stroke-width="1.2"/>
<text x="663.3333333333333" y="89" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold" >9</text>
<text x="663.3333333333333" y="106" text-anchor="middle" font-size="11" fill="#3b2314" >+8</text>
<line x1="40.0" y1="116" x2="40.0" y2="124" stroke="#3b2314"/>
<text x="40.0" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >0°</text>
<line x1="113.33333333333333" y1="116" x2="113.33333333333333" y2="124" stroke="#3b2314"/>
<text x="113.33333333333333" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >3°20′</text>
<line x1="186.66666666666666" y1="116" x2="186.66666666666666" y2="124" stroke="#3b2314"/>
<text x="186.66666666666666" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >6°40′</text>
<line x1="260.0" y1="116" x2="260.0" y2="124" stroke="#3b2314"/>
<text x="260.0" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >10°</text>
<line x1="333.3333333333333" y1="116" x2="333.3333333333333" y2="124" stroke="#3b2314"/>
<text x="333.3333333333333" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >13°20′</text>
<line x1="406.66666666666663" y1="116" x2="406.66666666666663" y2="124" stroke="#3b2314"/>
<text x="406.66666666666663" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >16°40′</text>
<line x1="480.0" y1="116" x2="480.0" y2="124" stroke="#3b2314"/>
<text x="480.0" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >20°</text>
<line x1="553.3333333333333" y1="116" x2="553.3333333333333" y2="124" stroke="#3b2314"/>
<text x="553.3333333333333" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >23°20′</text>
<line x1="626.6666666666666" y1="116" x2="626.6666666666666" y2="124" stroke="#3b2314"/>
<text x="626.6666666666666" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >26°40′</text>
<line x1="700.0" y1="116" x2="700.0" y2="124" stroke="#3b2314"/>
<text x="700.0" y="138" text-anchor="middle" font-size="10" fill="#3b2314" >30°</text>
<text x="40" y="58" text-anchor="start" font-size="12" fill="#3b2314" >Slice number (top) and how many signs to add to the starting sign (bottom)</text>
<line x1="304.0" y1="66" x2="304.0" y2="160" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="4,3"/>
<circle cx="304.0" cy="160" r="5" fill="#7f1d1d"/>
<text x="312.0" y="164" text-anchor="start" font-size="11" fill="#7f1d1d" font-weight="bold" >Lagna 12° Scorpio → slice 4</text>
<line x1="502.0" y1="66" x2="502.0" y2="185" stroke="#4b5563" stroke-width="2" stroke-dasharray="4,3"/>
<circle cx="502.0" cy="185" r="5" fill="#4b5563"/>
<text x="510.0" y="189" text-anchor="start" font-size="11" fill="#4b5563" font-weight="bold" >Moon 21° Cancer → slice 7</text>
<line x1="656.0" y1="66" x2="656.0" y2="210" stroke="#c2410c" stroke-width="2" stroke-dasharray="4,3"/>
<circle cx="656.0" cy="210" r="5" fill="#c2410c"/>
<text x="664.0" y="214" text-anchor="start" font-size="11" fill="#c2410c" font-weight="bold" >Sun 28° Scorpio → slice 9</text>
<rect x="40" y="232" width="660" height="78" rx="8" fill="none" stroke="#b8860b" stroke-width="1.5"/>
<text x="52" y="254" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="bold" >Where does slice 1 start?</text>
<text x="52" y="274" text-anchor="start" font-size="11" fill="#3b2314" >Movable sign (Ar, Cn, Li, Cp): from the same sign.   Fixed sign (Ta, Le, Sc, Aq): from the 9th sign.   Dual sign (Ge, Vi, Sg, Pi): from the 5th sign.</text>
<text x="52" y="294" text-anchor="start" font-size="11" fill="#3b2314" >Navamsa sign = starting sign + (slice number − 1).   Example: Sun 28° Scorpio → fixed → start Cancer → slice 9 → Cancer + 8 = Pisces.</text>
</svg>