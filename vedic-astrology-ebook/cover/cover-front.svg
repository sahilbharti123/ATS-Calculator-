<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ec"/>
      <stop offset="0.55" stop-color="#fdf1dc"/>
      <stop offset="1" stop-color="#f9dcc4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.7" stop-color="#f9c85a"/>
      <stop offset="1" stop-color="#f2a93b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c9b0"/>
      <stop offset="1" stop-color="#eeb39a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="2560" fill="url(#bg)"/>

  <!-- soft glow behind the sun -->
  <circle cx="1180" cy="520" r="420" fill="url(#glow)"/>
  <!-- sun rays (soft, rounded) -->
  <g stroke="#f4b95a" stroke-width="22" stroke-linecap="round" opacity="0.7">
    <line x1="1180" y1="200" x2="1180" y2="270"/><line x1="1180" y1="770" x2="1180" y2="840"/>
    <line x1="860" y1="520" x2="930" y2="520"/><line x1="1430" y1="520" x2="1500" y2="520"/>
    <line x1="954" y1="294" x2="1003" y2="343"/><line x1="1357" y1="697" x2="1406" y2="746"/>
    <line x1="1406" y1="294" x2="1357" y2="343"/><line x1="1003" y1="697" x2="954" y2="746"/>
  </g>
  <circle cx="1180" cy="520" r="215" fill="url(#sun)"/>
  <!-- gentle face on the sun: two soft closed eyes and a small smile -->
  <g stroke="#b45309" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M1105 505 q25 -22 50 0"/><path d="M1205 505 q25 -22 50 0"/>
    <path d="M1120 585 q60 55 120 0"/>
  </g>
  <!-- crescent moon, top left -->
  <g transform="translate(330,330)">
    <circle cx="0" cy="0" r="120" fill="#f3e9d2" stroke="#e0cfa8" stroke-width="4"/>
    <circle cx="48" cy="-22" r="108" fill="#fff9ec"/>
  </g>
  <!-- little stars -->
  <g fill="#e9b949" opacity="0.9">
    <path d="M560 250 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z"/>
    <path d="M700 420 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z"/>
    <path d="M220 640 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z"/>
    <path d="M1480 900 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M130 1000 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 2080 C 300 1960, 600 2020, 900 1980 S 1400 1900, 1600 1990 L1600 2560 L0 2560 Z" fill="url(#hill)"/>
  <path d="M0 2200 C 400 2100, 700 2180, 1000 2120 S 1400 2060, 1600 2140 L1600 2560 L0 2560 Z" fill="#e8a88c" opacity="0.85"/>

  <!-- the friendly kundali: rounded diamond chart with pastel planets -->
  <g transform="translate(800,1410) scale(0.85)">
    <rect x="-330" y="-330" width="660" height="660" rx="34" fill="#fffdf6" stroke="#c98a5b" stroke-width="10"/>
    <g stroke="#c98a5b" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="-330" y1="-330" x2="330" y2="330"/>
      <line x1="330" y1="-330" x2="-330" y2="330"/>
      <path d="M0 -330 L330 0 L0 330 L-330 0 Z"/>
    </g>
    <!-- pastel planet dots -->
    <circle cx="0" cy="-165" r="30" fill="#f6b26b"/>          <!-- Sun, house 1 -->
    <circle cx="-215" cy="-262" r="22" fill="#b7d7a8"/>       <!-- Mercury -->
    <circle cx="-265" cy="-215" r="22" fill="#f4a6a6"/>       <!-- Mars -->
    <circle cx="-165" cy="0" r="30" fill="#f9d976"/>          <!-- Jupiter -->
    <circle cx="0" cy="165" r="30" fill="#f4b6c2"/>           <!-- Venus -->
    <circle cx="165" cy="0" r="30" fill="#cfd8e8"/>           <!-- Moon -->
    <circle cx="215" cy="262" r="22" fill="#a9c4e2"/>         <!-- Saturn -->
    <circle cx="265" cy="-215" r="22" fill="#cbb7e6"/>        <!-- Rahu -->
    <circle cx="-265" cy="215" r="22" fill="#d8c7ea"/>        <!-- Ketu -->
    <text x="0" y="-152" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a3e12">Su</text>
    <text x="-165" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a3e12">Ju</text>
    <text x="0" y="176" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a3e12">Ve</text>
    <text x="165" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#3b4a63">Mo</text>
  </g>

  <!-- title block -->
  <text x="800" y="930" text-anchor="middle" font-size="172" font-weight="bold" fill="#8a3b2a" letter-spacing="2">Kundali</text>
  <text x="800" y="1075" text-anchor="middle" font-size="140" font-weight="bold" fill="#8a3b2a">Made Simple</text>

  <!-- subtitle ribbon -->
  <rect x="200" y="1760" width="1200" height="150" rx="75" fill="#fff4df" stroke="#e0a874" stroke-width="5"/>
  <text x="800" y="1820" text-anchor="middle" font-size="52" font-style="italic" fill="#7a3e12">Vedic astrology with a reason for everything</text>
  <text x="800" y="1880" text-anchor="middle" font-size="40" fill="#9a5a34">from your first chart to your first consultation</text>

  <!-- author -->
  <text x="800" y="2380" text-anchor="middle" font-size="88" fill="#5a2a1a" letter-spacing="4">Anushka Bharti</text>
  <text x="800" y="2450" text-anchor="middle" font-size="36" fill="#5a2a1a" font-style="italic">a love letter to everyone who found the old books closed</text>
</svg>
