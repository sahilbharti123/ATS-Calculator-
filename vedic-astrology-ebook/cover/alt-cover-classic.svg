<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" font-family="'Liberation Serif', 'Times New Roman', Georgia, serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.9">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.6" stop-color="#f8f1e2"/>
      <stop offset="1" stop-color="#eadfca"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="2560" fill="url(#bg)"/>

  <!-- double hairline frame -->
  <rect x="70" y="70" width="1460" height="2420" fill="none" stroke="#b8956a" stroke-width="3"/>
  <rect x="88" y="88" width="1424" height="2384" fill="none" stroke="#b8956a" stroke-width="1.2"/>

  <!-- large pale zodiac wheel, cropped at top right -->
  <g transform="translate(1290,300)" stroke="#d8c19a" fill="none" opacity="0.75">
    <circle r="640" stroke-width="2"/>
    <circle r="560" stroke-width="1.2"/>
    <circle r="480" stroke-width="1.2"/>
    <g stroke-width="1.2">
      <line x1="0" y1="-640" x2="0" y2="-480"/><line x1="0" y1="640" x2="0" y2="480"/>
      <line x1="-640" y1="0" x2="-480" y2="0"/><line x1="640" y1="0" x2="480" y2="0"/>
      <line x1="-320" y1="-554" x2="-240" y2="-416"/><line x1="320" y1="554" x2="240" y2="416"/>
      <line x1="-554" y1="-320" x2="-416" y2="-240"/><line x1="554" y1="320" x2="416" y2="240"/>
      <line x1="320" y1="-554" x2="240" y2="-416"/><line x1="-320" y1="554" x2="-240" y2="416"/>
      <line x1="554" y1="-320" x2="416" y2="-240"/><line x1="-554" y1="320" x2="-416" y2="240"/>
    </g>
  </g>
  <!-- a few small star points -->
  <g fill="#b8956a" opacity="0.8">
    <circle cx="300" cy="420" r="4"/><circle cx="420" cy="300" r="3"/><circle cx="240" cy="700" r="3"/>
    <circle cx="1380" cy="1180" r="3"/><circle cx="1300" cy="1330" r="4"/><circle cx="260" cy="1500" r="3"/>
  </g>

  <!-- title -->
  <text x="800" y="640" text-anchor="middle" font-size="176" font-weight="bold" fill="#6b1f1f" letter-spacing="4">Kundali</text>
  <text x="800" y="800" text-anchor="middle" font-size="150" font-weight="bold" fill="#6b1f1f" letter-spacing="2">Made Simple</text>
  <line x1="560" y1="870" x2="1040" y2="870" stroke="#b8956a" stroke-width="2"/>
  <text x="800" y="940" text-anchor="middle" font-size="42" fill="#5a3a28" letter-spacing="6">VEDIC ASTROLOGY WITH A REASON FOR EVERYTHING</text>

  <!-- the chart: fine line-work, Chart A (Meera) -->
  <g transform="translate(800,1470)">
    <rect x="-330" y="-330" width="660" height="660" fill="#fffdf8" stroke="#a0603c" stroke-width="4"/>
    <g stroke="#a0603c" stroke-width="2.5" fill="none">
      <line x1="-330" y1="-330" x2="330" y2="330"/>
      <line x1="330" y1="-330" x2="-330" y2="330"/>
      <path d="M0 -330 L330 0 L0 330 L-330 0 Z"/>
    </g>
    <g font-size="34" fill="#3b2314" text-anchor="middle" font-weight="bold">
      <text x="0" y="-150">Su  Me</text>
      <text x="-165" y="12">Ra</text>
      <text x="165" y="12">Ke</text>
      <text x="0" y="176">Ju</text>
      <text x="-165" y="-262">Sa</text>
      <text x="-268" y="185">Ma</text>
      <text x="165" y="-262">Ve</text>
      <text x="268" y="185">Mo</text>
    </g>
    <g font-size="22" fill="#b8956a" text-anchor="middle">
      <text x="0" y="-40">8</text><text x="-42" y="12">11</text><text x="42" y="12">5</text><text x="0" y="60">2</text>
      <text x="-165" y="-178">9</text><text x="-190" y="-150">10</text><text x="190" y="-150">6</text><text x="165" y="-178">7</text>
      <text x="-190" y="170">12</text><text x="-165" y="200">1</text><text x="165" y="200">3</text><text x="190" y="170">4</text>
    </g>
  </g>
  <text x="800" y="1900" text-anchor="middle" font-size="34" font-style="italic" fill="#5a3a28">From your first chart to your first consultation</text>

  <!-- author -->
  <line x1="640" y1="2200" x2="960" y2="2200" stroke="#b8956a" stroke-width="2"/>
  <text x="800" y="2300" text-anchor="middle" font-size="76" fill="#3b2314" letter-spacing="10">ANUSHKA BHARTI</text>
</svg>
