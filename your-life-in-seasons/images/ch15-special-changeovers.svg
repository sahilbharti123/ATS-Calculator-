<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360" font-family="Georgia, serif">
<rect x="1" y="1" width="738" height="358" rx="12" fill="#fffaf0" stroke="#b8956a" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2a5a">Five changeovers that ask for extra care</text>
<defs><marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e2a5a"/></marker></defs>
<rect x="40" y="60" width="110" height="44" rx="4" fill="#fbcfe8" stroke="#2b3350" stroke-width="1.1"/>
<text x="95.0" y="87" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Venus</text>
<line x1="156" y1="82.0" x2="190" y2="82.0" stroke="#1e2a5a" stroke-width="2" marker-end="url(#arr2)"/>
<rect x="198" y="60" width="110" height="44" rx="4" fill="#fed7aa" stroke="#2b3350" stroke-width="1.1"/>
<text x="253.0" y="87" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Sun</text>
<text x="328" y="87" text-anchor="start" font-size="11.5" fill="#2b3350">comfort to identity: the Minister of Pleasure hands the house to the King</text>
<rect x="40" y="116" width="110" height="44" rx="4" fill="#c7d2fe" stroke="#2b3350" stroke-width="1.1"/>
<text x="95.0" y="143" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Rahu</text>
<line x1="156" y1="138.0" x2="190" y2="138.0" stroke="#1e2a5a" stroke-width="2" marker-end="url(#arr2)"/>
<rect x="198" y="116" width="110" height="44" rx="4" fill="#fde68a" stroke="#2b3350" stroke-width="1.1"/>
<text x="253.0" y="143" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Jupiter</text>
<text x="328" y="143" text-anchor="start" font-size="11.5" fill="#2b3350">hunger to meaning: the Stranger hands the house to the Priest</text>
<rect x="40" y="172" width="110" height="44" rx="4" fill="#fecaca" stroke="#2b3350" stroke-width="1.1"/>
<text x="95.0" y="199" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Mars</text>
<line x1="156" y1="194.0" x2="190" y2="194.0" stroke="#1e2a5a" stroke-width="2" marker-end="url(#arr2)"/>
<rect x="198" y="172" width="110" height="44" rx="4" fill="#c7d2fe" stroke="#2b3350" stroke-width="1.1"/>
<text x="253.0" y="199" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Rahu</text>
<text x="328" y="199" text-anchor="start" font-size="11.5" fill="#2b3350">clear fights to blurred wants: the Commander hands the house to the Stranger</text>
<rect x="40" y="228" width="110" height="44" rx="4" fill="#bfdbfe" stroke="#2b3350" stroke-width="1.1"/>
<text x="95.0" y="255" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Saturn</text>
<line x1="156" y1="250.0" x2="190" y2="250.0" stroke="#1e2a5a" stroke-width="2" marker-end="url(#arr2)"/>
<rect x="198" y="228" width="110" height="44" rx="4" fill="#bbf7d0" stroke="#2b3350" stroke-width="1.1"/>
<text x="253.0" y="255" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Mercury</text>
<text x="328" y="255" text-anchor="start" font-size="11.5" fill="#2b3350">the long audit to the clever years: the Judge hands the house to the Prince</text>
<rect x="40" y="284" width="110" height="44" rx="4" fill="#e9d5ff" stroke="#2b3350" stroke-width="1.1"/>
<text x="95.0" y="311" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Ketu</text>
<line x1="156" y1="306.0" x2="190" y2="306.0" stroke="#1e2a5a" stroke-width="2" marker-end="url(#arr2)"/>
<rect x="198" y="284" width="110" height="44" rx="4" fill="#fbcfe8" stroke="#2b3350" stroke-width="1.1"/>
<text x="253.0" y="311" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Venus</text>
<text x="328" y="311" text-anchor="start" font-size="11.5" fill="#2b3350">emptiness to abundance: the headless Sadhu hands the house to the Minister</text>
<text x="370.0" y="344" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">Every changeover is a bridge; these five join banks of very different heights.</text>
</svg>