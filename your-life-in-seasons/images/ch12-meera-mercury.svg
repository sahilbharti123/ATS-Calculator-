<text x='477.2' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#2b3350'>Meera's age (the Ketu season begins at 11.5)</text>
<text x='40' y='292' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Faded, dashed blocks ran before she was born; the balance at birth skips them.</text>
<text x='40' y='310' font-family='Georgia, serif' font-size='12' fill='#2b3350'>She arrived inside Mercury/Venus. Venus sits in her room 12, the 12th from Mercury: a wrong-room start (dashed red).</text>
<text x='40' y='328' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Mercury tests her (Scorpio rising), yet it sits in her room 1 with the Sun: a clever, watchful, talkative child.</text>
