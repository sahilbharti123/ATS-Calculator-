<text x='370.0' y='56' text-anchor='middle' font-family='Georgia, serif' font-size='13' fill='#2b3350'>The full 17-year season ran Jun 1983 to Jun 2000. She was born 12 Dec 1988, so she lived its last 11.475 years.</text>
