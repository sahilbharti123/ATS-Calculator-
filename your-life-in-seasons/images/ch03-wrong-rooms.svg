<text x="175.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Saturn</text>
<rect x="205" y="80" width="51" height="60" rx="5" fill="#ffffff" stroke="#2b3350" stroke-width="1"/>
<text x="230.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">4th</text>
<text x="230.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 3</text>
<rect x="260" y="80" width="51" height="60" rx="5" fill="#bbf7d0" stroke="#2b3350" stroke-width="1"/>
<text x="285.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">5th</text>
<text x="285.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 4</text>
<text x="285.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Rahu</text>
<rect x="315" y="80" width="51" height="60" rx="5" fill="#fecaca" stroke="#2b3350" stroke-width="1"/>
<text x="340.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">6th</text>
<text x="340.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 5</text>
<text x="340.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Mars</text>
<rect x="370" y="80" width="51" height="60" rx="5" fill="#ffffff" stroke="#2b3350" stroke-width="1"/>
<text x="395.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">7th</text>
<text x="395.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 6</text>
<rect x="425" y="80" width="51" height="60" rx="5" fill="#fecaca" stroke="#2b3350" stroke-width="1"/>
<text x="450.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">8th</text>
<text x="450.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 7</text>
<text x="450.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Jupiter</text>
<rect x="480" y="80" width="51" height="60" rx="5" fill="#bbf7d0" stroke="#2b3350" stroke-width="1"/>
<text x="505.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">9th</text>
<text x="505.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 8</text>
<rect x="535" y="80" width="51" height="60" rx="5" fill="#ffffff" stroke="#2b3350" stroke-width="1"/>
<text x="560.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">10th</text>
<text x="560.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 9</text>
<text x="560.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Moon</text>
<rect x="590" y="80" width="51" height="60" rx="5" fill="#ffffff" stroke="#2b3350" stroke-width="1"/>
<text x="615.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">11th</text>
<text x="615.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 10</text>
<text x="615.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Ketu</text>
<rect x="645" y="80" width="51" height="60" rx="5" fill="#fecaca" stroke="#2b3350" stroke-width="1"/>
<text x="670.5" y="98" text-anchor="middle" font-size="12" fill="#1e2a5a" font-weight="bold">12th</text>
<text x="670.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 11</text>
<text x="40" y="68" text-anchor="start" font-size="10.5" fill="#2b3350">Meera's chart: Venus sits in room 12, so room 12 is the 1st counted from Venus, room 1 is the 2nd, and so on round the circle.</text>
<rect x="40" y="169" width="14" height="14" fill="#fecaca" stroke="#2b3350"/>
<text x="62" y="180" text-anchor="start" font-size="11" fill="#2b3350">6th, 8th, 12th from the season lord: the wrong rooms. Here Mars (6th) and Jupiter (8th).</text>
<rect x="40" y="193" width="14" height="14" fill="#bbf7d0" stroke="#2b3350"/>
<text x="62" y="204" text-anchor="start" font-size="11" fill="#2b3350">1st, 5th, 9th from the season lord: the lucky rooms. Here Rahu sits in the 5th, and her marriage came in Venus/Rahu.</text>
<text x="40" y="234" text-anchor="start" font-size="10.5" fill="#2b3350">The 4th, 7th and 10th are pillar rooms (steady); 2nd, 3rd and 11th are gains and effort; all count from the season lord, not from the rising sign.</text>
<text x="370.0" y="286" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">The same twelve rooms, counted afresh from wherever the season lord stands.</text>
</svg>