<text x="120.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Sun</text>
<text x="120.5" y="138" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Mercury</text>
