<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" font-family="Georgia, serif">
<rect x="1" y="1" width="738" height="298" rx="12" fill="#fffaf0" stroke="#b8956a" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2a5a">Counting rooms from the season lord: the 6th, 8th and 12th are the wrong rooms</text>
<rect x="40" y="80" width="51" height="60" rx="5" fill="#bbf7d0" stroke="#2b3350" stroke-width="1"/>
