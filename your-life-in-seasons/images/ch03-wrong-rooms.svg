<text x="65.5" y="114" text-anchor="middle" font-size="9" fill="#2b3350">room 12</text>
<text x="65.5" y="128" text-anchor="middle" font-size="8.5" fill="#1e2a5a" font-weight="bold">Venus</text>
<rect x="95" y="80" width="51" height="60" rx="5" fill="#ffffff" stroke="#2b3350" stroke-width="1"/>
