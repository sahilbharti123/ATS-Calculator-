<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360" font-family="Georgia, serif">
<rect x="1" y="1" width="738" height="358" rx="12" fill="#fffaf0" stroke="#b8956a" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2a5a">Meera's balance at birth: how much of the first season was left</text>
<text x="60" y="60" text-anchor="start" font-size="12" fill="#1e2a5a" font-weight="bold">Ashlesha, Mercury's star, 16°40′ to 30°00′ Cancer (13°20′ wide)</text>
<rect x="60" y="90" width="620" height="40" fill="#ffffff" stroke="#2b3350" stroke-width="1.2"/>
<rect x="60" y="90" width="201.5" height="40" fill="#e5e7eb" stroke="none"/>
<rect x="261.5" y="90" width="418.5" height="40" fill="#bbf7d0" stroke="none"/>
<rect x="60" y="90" width="620" height="40" fill="none" stroke="#2b3350" stroke-width="1.2"/>
<text x="160.74999999999997" y="114" text-anchor="middle" font-size="11" fill="#2b3350">already passed: 4°20′ (32.5%)</text>
<text x="470.75" y="114" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">still to come: 9°00′ (67.5%)</text>
<line x1="261.5" y1="82" x2="261.5" y2="138" stroke="#1e2a5a" stroke-width="2"/>
<circle cx="261.5" cy="78" r="6" fill="#1e2a5a"/>
<text x="261.49999999999994" y="152" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">Moon at 21°00′</text>
<text x="60" y="152" text-anchor="middle" font-size="10" fill="#2b3350">16°40′</text>
<text x="680" y="152" text-anchor="middle" font-size="10" fill="#2b3350">30°00′</text>
<text x="60" y="185" text-anchor="start" font-size="12" fill="#2b3350">9° left out of 13°20′  =  9 ÷ 13.333  =  0.675, that is 67.5%</text>
<text x="60" y="207" text-anchor="start" font-size="12" fill="#2b3350">67.5% of Mercury's 17 years  =  11.475 years  =  about 11 years and 6 months</text>
<text x="60" y="229" text-anchor="start" font-size="12" fill="#1e2a5a" font-weight="bold">Born 12 Dec 1988, so the Mercury season ends around June 2000 and Ketu's begins</text>
<rect x="60.0" y="275" width="177.9" height="34" fill="#bbf7d0" stroke="#2b3350" stroke-width="1"/>
<text x="148.93125" y="296" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">Mercury (11.475 y)</text>
<rect x="237.9" y="275" width="108.5" height="34" fill="#e9d5ff" stroke="#2b3350" stroke-width="1"/>
<text x="292.1125" y="296" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">Ketu (7 y)</text>
<rect x="346.4" y="275" width="310.0" height="34" fill="#fbcfe8" stroke="#2b3350" stroke-width="1"/>
<text x="501.36249999999995" y="296" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">Venus (20 y)</text>
<line x1="60.0" y1="309" x2="60.0" y2="317" stroke="#2b3350"/>
<text x="60.0" y="329" text-anchor="middle" font-size="10" fill="#2b3350">Dec 1988</text>
<line x1="237.9" y1="309" x2="237.9" y2="317" stroke="#2b3350"/>
<text x="237.8625" y="329" text-anchor="middle" font-size="10" fill="#2b3350">Jun 2000</text>
<line x1="346.4" y1="309" x2="346.4" y2="317" stroke="#2b3350"/>
<text x="346.3625" y="329" text-anchor="middle" font-size="10" fill="#2b3350">Jun 2007</text>
<line x1="656.4" y1="309" x2="656.4" y2="317" stroke="#2b3350"/>
<text x="656.3625" y="329" text-anchor="middle" font-size="10" fill="#2b3350">Jun 2027</text>
<text x="370.0" y="348" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">A shortened first season, then full-length seasons in the fixed order. Dates are approximate.</text>
</svg>