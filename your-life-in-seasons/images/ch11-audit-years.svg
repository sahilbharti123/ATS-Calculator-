<rect x='0.5' y='0.5' width='739' height='419' fill='#fffaf0' stroke='#b8956a' stroke-width='1.5' rx='6'/>
<text x='370.0' y='34' text-anchor='middle' font-family='Georgia, serif' font-size='19' font-weight='bold' fill='#1e2a5a'>The audit years: Saturn's seven and a half years inside a Saturn season</text>
<text x='370.0' y='56' text-anchor='middle' font-family='Georgia, serif' font-size='13' fill='#2b3350'>Two voices of the same Judge at once: the season (the long bar) and the weather overhead (the band inside).</text>
<rect x='40' y='120' width='660' height='56' fill='#bfdbfe' stroke='#b8956a' stroke-width='1.2'/>
<text x='48' y='153.0' font-family='Georgia, serif' font-size='13' fill='#2b3350'>Saturn season: 19 years</text>
<rect x='144.2' y='130' width='260.5' height='36' fill='#1e2a5a' fill-opacity='0.22' stroke='#1e2a5a' stroke-width='1.5'/>
<text x='187.6' y='196' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>12th from the Moon</text>
<text x='187.6' y='210' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>about 2.5 years</text>
<line x1='231.1' y1='130' x2='231.1' y2='166' stroke='#1e2a5a' stroke-width='1' stroke-dasharray='3 2'/>
<text x='274.5' y='196' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>over the Moon</text>
<text x='274.5' y='210' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>about 2.5 years</text>
<line x1='317.9' y1='130' x2='317.9' y2='166' stroke='#1e2a5a' stroke-width='1' stroke-dasharray='3 2'/>
<text x='361.3' y='196' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>2nd from the Moon</text>
<text x='361.3' y='210' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>about 2.5 years</text>
<text x='274.5' y='106' text-anchor='middle' font-family='Georgia, serif' font-size='13' font-weight='bold' fill='#1e2a5a'>Saturn's seven and a half years (about 7.5 years)</text>
