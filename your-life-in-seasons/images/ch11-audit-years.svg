<svg xmlns='http://www.w3.org/2000/svg' width='740' height='440' viewBox='0 0 740 440'>
<rect x='0.5' y='0.5' width='739' height='439' fill='#fffaf0' stroke='#b8956a' stroke-width='1.5' rx='6'/>
<text x='370.0' y='34' text-anchor='middle' font-family='Georgia, serif' font-size='19' font-weight='bold' fill='#1e2a5a'>The audit years: seven and a half inside nineteen</text>
<text x='370.0' y='56' text-anchor='middle' font-family='Georgia, serif' font-size='13' fill='#2b3350'>Two voices of the same Judge at once: the season (the long bar) and the weather overhead (the dark band).</text>
<rect x='40' y='120' width='660' height='56' fill='#bfdbfe' stroke='#b8956a' stroke-width='1.2'/>
<text x='48' y='153.0' font-family='Georgia, serif' font-size='13' fill='#2b3350'>Saturn season: 19 years</text>
<rect x='248.4' y='130' width='260.5' height='36' fill='#1e2a5a' fill-opacity='0.22' stroke='#1e2a5a' stroke-width='1.5'/>
<text x='291.8' y='194' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>sign before</text>
<text x='291.8' y='207' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>the Moon</text>
<text x='291.8' y='220' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>about 2.5 years</text>
<line x1='335.3' y1='130' x2='335.3' y2='166' stroke='#1e2a5a' stroke-width='1' stroke-dasharray='3 2'/>
<text x='378.7' y='194' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>the Moon's</text>
<text x='378.7' y='207' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>own sign</text>
<text x='378.7' y='220' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>about 2.5 years</text>
<line x1='422.1' y1='130' x2='422.1' y2='166' stroke='#1e2a5a' stroke-width='1' stroke-dasharray='3 2'/>
<text x='465.5' y='194' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>sign after</text>
<text x='465.5' y='207' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>the Moon</text>
<text x='465.5' y='220' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>about 2.5 years</text>
<text x='378.7' y='106' text-anchor='middle' font-family='Georgia, serif' font-size='13' font-weight='bold' fill='#1e2a5a'>Saturn's seven and a half years</text>
<line x1='248.4' y1='112' x2='248.4' y2='130' stroke='#1e2a5a' stroke-width='1'/>
<line x1='508.9' y1='112' x2='508.9' y2='130' stroke='#1e2a5a' stroke-width='1'/>
<line x1='40' y1='246' x2='700' y2='246' stroke='#b8956a' stroke-width='1'/>
<line x1='40.0' y1='242' x2='40.0' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='40.0' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>0</text>
<line x1='74.7' y1='242' x2='74.7' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='109.5' y1='242' x2='109.5' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='109.5' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>2</text>
<line x1='144.2' y1='242' x2='144.2' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='178.9' y1='242' x2='178.9' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='178.9' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>4</text>
<line x1='213.7' y1='242' x2='213.7' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='248.4' y1='242' x2='248.4' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='248.4' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>6</text>
<line x1='283.2' y1='242' x2='283.2' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='317.9' y1='242' x2='317.9' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='317.9' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>8</text>
<line x1='352.6' y1='242' x2='352.6' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='387.4' y1='242' x2='387.4' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='387.4' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>10</text>
<line x1='422.1' y1='242' x2='422.1' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='456.8' y1='242' x2='456.8' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='456.8' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>12</text>
<line x1='491.6' y1='242' x2='491.6' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='526.3' y1='242' x2='526.3' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='526.3' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>14</text>
<line x1='561.1' y1='242' x2='561.1' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='595.8' y1='242' x2='595.8' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='595.8' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>16</text>
<line x1='630.5' y1='242' x2='630.5' y2='250' stroke='#b8956a' stroke-width='1'/>
<line x1='665.3' y1='242' x2='665.3' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='665.3' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>18</text>
<line x1='700.0' y1='242' x2='700.0' y2='250' stroke='#b8956a' stroke-width='1'/>
<text x='700.0' y='264' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>19</text>
<text x='370.0' y='282' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#2b3350'>years into the Saturn season (the band can fall anywhere; here it begins in year 6)</text>
<text x='40' y='314' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Why 7.5 years: Saturn needs about 2.5 years to cross one sign, and the band covers three signs,</text>
<text x='40' y='332' font-family='Georgia, serif' font-size='12' fill='#2b3350'>the sign before your Moon, the Moon's own sign, and the sign after it. Three times 2.5 is 7.5.</text>
<text x='40' y='350' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Why it often falls inside a Saturn season: Saturn circles the sky in about 29.5 years, so in any</text>
<text x='40' y='368' font-family='Georgia, serif' font-size='12' fill='#2b3350'>19-year stretch it crosses about two thirds of the zodiac. Many Saturn seasons catch the band; some do not.</text>
<text x='40' y='386' font-family='Georgia, serif' font-size='12' fill='#2b3350'>What it feels like: the same Judge speaking by season and by weather. Heavier, and the clearest audit of all.</text>
</svg>