<text x='700.0' y='254' text-anchor='middle' font-family='Georgia, serif' font-size='10' fill='#2b3350'>19</text>
<text x='370.0' y='272' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#2b3350'>years into the Saturn season (the band can fall anywhere; here it begins in year 3)</text>
<text x='40' y='304' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Why the band is 7.5 years: Saturn needs about 2.5 years to cross one sign, and the band covers three signs:</text>
<text x='40' y='322' font-family='Georgia, serif' font-size='12' fill='#2b3350'>the sign before your Moon, your Moon's own sign, and the sign after it. Three times 2.5 is 7.5.</text>
<text x='40' y='340' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Why it falls inside a Saturn season for many people: Saturn circles the sky in about 29.5 years, so in any</text>
<text x='40' y='358' font-family='Georgia, serif' font-size='12' fill='#2b3350'>19-year stretch it crosses roughly two thirds of the zodiac. Many Saturn seasons catch the band; some do not.</text>
<text x='40' y='376' font-family='Georgia, serif' font-size='12' fill='#2b3350'>What it feels like: the same Judge speaking by season and by weather. Heavier, yes. Also the clearest audit you will get.</text>
</svg>