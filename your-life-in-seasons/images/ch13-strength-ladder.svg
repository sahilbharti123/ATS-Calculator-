<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="Georgia, serif">
<rect x="1" y="1" width="738" height="328" rx="12" fill="#fffaf0" stroke="#b8956a" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2a5a">How strong is the season lord? Five rungs and two flags</text>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e2a5a"/></marker></defs>
<rect x="30" y="60" width="128" height="120" rx="4" fill="#bbf7d0" stroke="#2b3350" stroke-width="1.1"/>
<text x="94.0" y="84" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">At home</text>
<text x="94.0" y="102" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">its own sign</text>
<text x="94.0" y="132" text-anchor="middle" font-size="10.5" fill="#2b3350">Meera's Venus in in</text>
<text x="94.0" y="147" text-anchor="middle" font-size="10.5" fill="#2b3350">Libra; Arjun's Saturn Aquarius</text>
<text x="94.0" y="168" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">strong</text>
<rect x="168" y="60" width="128" height="120" rx="4" fill="#bbf7d0" stroke="#2b3350" stroke-width="1.1"/>
<text x="232.0" y="84" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Strongest place</text>
<text x="232.0" y="102" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">the sign that lifts it</text>
<text x="232.0" y="132" text-anchor="middle" font-size="10.5" fill="#2b3350">Arjun's Moon in in</text>
<text x="232.0" y="147" text-anchor="middle" font-size="10.5" fill="#2b3350">Taurus; Devika's Jupiter Cancer</text>
<text x="232.0" y="168" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">strong</text>
<rect x="306" y="60" width="128" height="120" rx="4" fill="#fde68a" stroke="#2b3350" stroke-width="1.1"/>
<text x="370.0" y="84" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Friend's sign</text>
<text x="370.0" y="102" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">comfortable lodgings</text>
<text x="370.0" y="132" text-anchor="middle" font-size="10.5" fill="#2b3350">Arjun's Rahu in Libra,</text>
<text x="370.0" y="147" text-anchor="middle" font-size="10.5" fill="#2b3350">Venus's sign</text>
<text x="370.0" y="168" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">fair</text>
<rect x="444" y="60" width="128" height="120" rx="4" fill="#fed7aa" stroke="#2b3350" stroke-width="1.1"/>
<text x="508.0" y="84" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Neutral or enemy's sign</text>
<text x="508.0" y="102" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">a stranger's house</text>
<text x="508.0" y="132" text-anchor="middle" font-size="10.5" fill="#2b3350">Devika's Saturn in the</text>
<text x="508.0" y="147" text-anchor="middle" font-size="10.5" fill="#2b3350">Leo, Sun's sign</text>
<text x="508.0" y="168" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">weaker</text>
<rect x="582" y="60" width="128" height="120" rx="4" fill="#fecaca" stroke="#2b3350" stroke-width="1.1"/>
<text x="646.0" y="84" text-anchor="middle" font-size="13" fill="#1e2a5a" font-weight="bold">Weakest place</text>
<text x="646.0" y="102" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">the sign that drains it</text>
<text x="646.0" y="132" text-anchor="middle" font-size="10.5" fill="#2b3350">none of our three; a</text>
<text x="646.0" y="147" text-anchor="middle" font-size="10.5" fill="#2b3350">composite in the text</text>
<text x="646.0" y="168" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">weak</text>
<line x1="30" y1="198" x2="710" y2="198" stroke="#1e2a5a" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="30" y="216" text-anchor="start" font-size="11" fill="#1e2a5a">stronger: the season delivers more of what the lord promises</text>
<text x="710" y="216" text-anchor="end" font-size="11" fill="#1e2a5a">weaker: the promise arrives late, thin or in a changed form</text>
<rect x="30" y="240" width="330" height="70" rx="4" fill="#e5e7eb" stroke="#2b3350" stroke-width="1.1"/>
<text x="42" y="262" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">Flag 1: outshone by the Sun</text>
<text x="42" y="282" text-anchor="start" font-size="10.5" fill="#2b3350">too close to the Sun (within about 10 to 17 degrees).</text>
<text x="42" y="298" text-anchor="start" font-size="10.5" fill="#2b3350">Meera's Saturn (7 degrees), Arjun's Saturn (7), Devika's Mars (8).</text>
<rect x="380" y="240" width="330" height="70" rx="4" fill="#e5e7eb" stroke="#2b3350" stroke-width="1.1"/>
<text x="392" y="262" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">Flag 2: walking backwards</text>
<text x="392" y="282" text-anchor="start" font-size="10.5" fill="#2b3350">appears to move the wrong way against the stars.</text>
<text x="392" y="298" text-anchor="start" font-size="10.5" fill="#2b3350">Meera's Mars and Jupiter; Arjun's Mars.</text>
</svg>