<svg xmlns='http://www.w3.org/2000/svg' width='740' height='470' viewBox='0 0 740 470'>
<rect x='0.5' y='0.5' width='739' height='469' fill='#fffaf0' stroke='#b8956a' stroke-width='1.5' rx='6'/>
<text x='370.0' y='34' text-anchor='middle' font-family='Georgia, serif' font-size='19' font-weight='bold' fill='#1e2a5a'>Why the Prince is never far from the King</text>
<text x='370.0' y='56' text-anchor='middle' font-family='Georgia, serif' font-size='13' fill='#2b3350'>Mercury circles inside the Earth's path, so from here it never appears more than about 28 degrees from the Sun.</text>
<circle cx='370' cy='150' r='22' fill='#fed7aa' stroke='#b8956a' stroke-width='1.5'/>
<text x='370' y='155' text-anchor='middle' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Sun</text>
<circle cx='370' cy='150' r='55' fill='none' stroke='#1e2a5a' stroke-width='1' stroke-dasharray='4 3'/>
<text x='370' y='85' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>Mercury's path around the Sun</text>
<circle cx='370' cy='370' r='12' fill='#e5e7eb' stroke='#b8956a' stroke-width='1.5'/>
<text x='390' y='374' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Earth (where we stand)</text>
<line x1='370' y1='370' x2='423.3' y2='163.8' stroke='#1e2a5a' stroke-width='1.2'/>
<circle cx='423.3' cy='163.8' r='6' fill='#bbf7d0' stroke='#b8956a' stroke-width='1.2'/>
<text x='437.3' y='167.8' text-anchor='start' font-family='Georgia, serif' font-size='11' fill='#2b3350'>Mercury at its farthest, east</text>
<line x1='370' y1='370' x2='316.7' y2='163.8' stroke='#1e2a5a' stroke-width='1.2'/>
<circle cx='316.7' cy='163.8' r='6' fill='#bbf7d0' stroke='#b8956a' stroke-width='1.2'/>
<text x='302.7' y='167.8' text-anchor='end' font-family='Georgia, serif' font-size='11' fill='#2b3350'>Mercury at its farthest, west</text>
<line x1='370' y1='370' x2='370' y2='172' stroke='#2b3350' stroke-width='0.8' stroke-dasharray='2 2'/>
<text x='350' y='374' text-anchor='end' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>at most about 28 degrees each side</text>
<text x='40' y='426' font-family='Georgia, serif' font-size='12' fill='#2b3350'>So in every birth chart Mercury sits in the Sun's sign or the one next door, and is often outshone by it.</text>
<text x='40' y='446' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Not to scale. This is astronomy, not tradition: it is simply where Mercury can ever be seen from here.</text>
</svg>