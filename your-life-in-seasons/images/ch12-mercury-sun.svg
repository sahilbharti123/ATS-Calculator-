<svg xmlns='http://www.w3.org/2000/svg' width='740' height='400' viewBox='0 0 740 400'>
<rect x='0.5' y='0.5' width='739' height='399' fill='#fffaf0' stroke='#b8956a' stroke-width='1.5' rx='6'/>
<text x='370.0' y='34' text-anchor='middle' font-family='Georgia, serif' font-size='19' font-weight='bold' fill='#1e2a5a'>Why the Prince is never far from the King</text>
<text x='370.0' y='56' text-anchor='middle' font-family='Georgia, serif' font-size='13' fill='#2b3350'>Mercury orbits inside the Earth's orbit, so from Earth it can never appear more than about 28 degrees from the Sun.</text>
<circle cx='300' cy='230' r='22' fill='#fed7aa' stroke='#b8956a' stroke-width='1.5'/>
<text x='300' y='235' text-anchor='middle' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Sun</text>
<circle cx='300' cy='230' r='55' fill='none' stroke='#1e2a5a' stroke-width='1' stroke-dasharray='4 3'/>
<text x='300' y='167' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>Mercury's orbit</text>
<path d='M 111.6 361.9 A 230 230 0 0 0 488.4 361.9' fill='none' stroke='#b8956a' stroke-width='1' stroke-dasharray='6 4'/>
<circle cx='300' cy='360' r='12' fill='#e5e7eb' stroke='#b8956a' stroke-width='1.5'/>
<text x='318' y='364' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Earth</text>
<line x1='300' y1='360' x2='349.8' y2='253.3' stroke='#1e2a5a' stroke-width='1.2'/>
<circle cx='349.8' cy='253.3' r='6' fill='#bbf7d0' stroke='#b8956a' stroke-width='1.2'/>
<text x='363.8' y='257.3' text-anchor='start' font-family='Georgia, serif' font-size='11' fill='#2b3350'>Mercury at its farthest, east</text>
<line x1='300' y1='360' x2='250.2' y2='253.3' stroke='#1e2a5a' stroke-width='1.2'/>
<circle cx='250.2' cy='253.3' r='6' fill='#bbf7d0' stroke='#b8956a' stroke-width='1.2'/>
<text x='236.2' y='257.3' text-anchor='end' font-family='Georgia, serif' font-size='11' fill='#2b3350'>Mercury at its farthest, west</text>
<line x1='300' y1='360' x2='300' y2='252' stroke='#2b3350' stroke-width='0.8' stroke-dasharray='2 2'/>
<text x='300' y='338' text-anchor='middle' font-family='Georgia, serif' font-size='11' fill='#1e2a5a'>the whole angle is at most about 28 degrees each side</text>
<text x='40' y='356' font-family='Georgia, serif' font-size='12' fill='#2b3350'>So in every birth chart Mercury sits in the Sun's sign or the one next door, and is often outshone by it.</text>
<text x='40' y='376' font-family='Georgia, serif' font-size='12' fill='#2b3350'>Not to scale. Astronomy, not tradition: this is simply where Mercury can be seen from here.</text>
</svg>