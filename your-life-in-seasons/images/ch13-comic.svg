<rect x="792" y="122" width="320" height="67" rx="12" fill="#fff" stroke="#2b3350" stroke-width="2"/><polygon points="1012.2,188 1030.2,188 1021.2,250.0" fill="#fff" stroke="#2b3350" stroke-width="2"/><line x1="1013.2" y1="188" x2="1029.2" y2="188" stroke="#fff" stroke-width="3"/><text x="952.0" y="139.9" text-anchor="middle" font-size="13" fill="#2b3350" font-family="Georgia, serif">And whether it is on your side. And who it is</text><text x="952.0" y="156.9" text-anchor="middle" font-size="13" fill="#2b3350" font-family="Georgia, serif">sitting with. Three questions. Then panic, if</text><text x="952.0" y="173.9" text-anchor="middle" font-size="13" fill="#2b3350" font-family="Georgia, serif">you must.</text>
