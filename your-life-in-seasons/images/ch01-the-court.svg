<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="Georgia, serif">
<rect x="1" y="1" width="738" height="328" rx="12" fill="#fffaf0" stroke="#b8956a" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2a5a">The nine courtiers and the years each one runs the household</text>
<rect x="30" y="56" width="220" height="76" rx="8" fill="#e9d5ff" stroke="#2b3350" stroke-width="1"/>
<text x="42" y="78" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">1. Ketu</text>
<text x="238" y="78" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">7 years</text>
<text x="42" y="98" text-anchor="start" font-size="11" fill="#2b3350">the headless Sadhu</text>
<text x="42" y="116" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to let go</text>
<rect x="262" y="56" width="220" height="76" rx="8" fill="#fbcfe8" stroke="#2b3350" stroke-width="1"/>
<text x="274" y="78" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">2. Venus</text>
<text x="470" y="78" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">20 years</text>
<text x="274" y="98" text-anchor="start" font-size="11" fill="#2b3350">the Minister of Pleasure</text>
<text x="274" y="116" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to enjoy and love</text>
<rect x="494" y="56" width="220" height="76" rx="8" fill="#fed7aa" stroke="#2b3350" stroke-width="1"/>
<text x="506" y="78" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">3. Sun</text>
<text x="702" y="78" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">6 years</text>
<text x="506" y="98" text-anchor="start" font-size="11" fill="#2b3350">the King</text>
<text x="506" y="116" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to stand up and be seen</text>
<rect x="30" y="144" width="220" height="76" rx="8" fill="#e5e7eb" stroke="#2b3350" stroke-width="1"/>
<text x="42" y="166" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">4. Moon</text>
<text x="238" y="166" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">10 years</text>
<text x="42" y="186" text-anchor="start" font-size="11" fill="#2b3350">the Queen Mother</text>
<text x="42" y="204" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to feel and nourish</text>
<rect x="262" y="144" width="220" height="76" rx="8" fill="#fecaca" stroke="#2b3350" stroke-width="1"/>
<text x="274" y="166" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">5. Mars</text>
<text x="470" y="166" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">7 years</text>
<text x="274" y="186" text-anchor="start" font-size="11" fill="#2b3350">the Commander</text>
<text x="274" y="204" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to act and fight fair</text>
<rect x="494" y="144" width="220" height="76" rx="8" fill="#c7d2fe" stroke="#2b3350" stroke-width="1"/>
<text x="506" y="166" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">6. Rahu</text>
<text x="702" y="166" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">18 years</text>
<text x="506" y="186" text-anchor="start" font-size="11" fill="#2b3350">the smoke-headed Stranger</text>
<text x="506" y="204" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to want, and watch the wanting</text>
<rect x="30" y="232" width="220" height="76" rx="8" fill="#fde68a" stroke="#2b3350" stroke-width="1"/>
<text x="42" y="254" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">7. Jupiter</text>
<text x="238" y="254" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">16 years</text>
<text x="42" y="274" text-anchor="start" font-size="11" fill="#2b3350">the Royal Priest</text>
<text x="42" y="292" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to grow and teach</text>
<rect x="262" y="232" width="220" height="76" rx="8" fill="#bfdbfe" stroke="#2b3350" stroke-width="1"/>
<text x="274" y="254" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">8. Saturn</text>
<text x="470" y="254" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">19 years</text>
<text x="274" y="274" text-anchor="start" font-size="11" fill="#2b3350">the old Judge of Labour</text>
<text x="274" y="292" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to work and wait</text>
<rect x="494" y="232" width="220" height="76" rx="8" fill="#bbf7d0" stroke="#2b3350" stroke-width="1"/>
<text x="506" y="254" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">9. Mercury</text>
<text x="702" y="254" text-anchor="end" font-size="12" fill="#1e2a5a" font-weight="bold">17 years</text>
<text x="506" y="274" text-anchor="start" font-size="11" fill="#2b3350">the clever young Prince</text>
<text x="506" y="292" text-anchor="start" font-size="11" fill="#2b3350" font-style="italic">asks you to learn and speak</text>
<text x="370.0" y="316" text-anchor="middle" font-size="12" fill="#2b3350" font-style="italic">Nine courtiers, 120 years, always in this order. Where you start depends on the Moon.</text>
</svg>