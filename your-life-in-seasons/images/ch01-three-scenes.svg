<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" font-family="Georgia, serif">
<rect x="1" y="1" width="738" height="298" rx="12" fill="#fffaf0" stroke="#b8956a" stroke-width="2"/>
<text x="370.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e2a5a">One woman, three seasons: the same life at 24, 31 and 40</text>
<rect x="40.0" y="110" width="92.4" height="44" fill="#e9d5ff" stroke="#2b3350" stroke-width="1"/>
<text x="86.2" y="129" text-anchor="middle" font-size="12" fill="#2b3350" font-weight="bold">Ketu</text>
<text x="86.2" y="145" text-anchor="middle" font-size="10" fill="#2b3350">7 years</text>
<text x="40.0" y="170" text-anchor="middle" font-size="10" fill="#2b3350">0</text>
<rect x="132.4" y="110" width="264.0" height="44" fill="#fbcfe8" stroke="#2b3350" stroke-width="1"/>
<text x="264.4" y="129" text-anchor="middle" font-size="12" fill="#2b3350" font-weight="bold">Venus</text>
<text x="264.4" y="145" text-anchor="middle" font-size="10" fill="#2b3350">20 years</text>
<text x="132.4" y="170" text-anchor="middle" font-size="10" fill="#2b3350">7</text>
<rect x="396.4" y="110" width="79.2" height="44" fill="#fed7aa" stroke="#2b3350" stroke-width="1"/>
<text x="436.0" y="129" text-anchor="middle" font-size="12" fill="#2b3350" font-weight="bold">Sun</text>
<text x="436.0" y="145" text-anchor="middle" font-size="10" fill="#2b3350">6 years</text>
<text x="396.4" y="170" text-anchor="middle" font-size="10" fill="#2b3350">27</text>
<rect x="475.6" y="110" width="132.0" height="44" fill="#e5e7eb" stroke="#2b3350" stroke-width="1"/>
<text x="541.6" y="129" text-anchor="middle" font-size="12" fill="#2b3350" font-weight="bold">Moon</text>
<text x="541.6" y="145" text-anchor="middle" font-size="10" fill="#2b3350">10 years</text>
<text x="475.6" y="170" text-anchor="middle" font-size="10" fill="#2b3350">33</text>
<rect x="607.6" y="110" width="92.4" height="44" fill="#fecaca" stroke="#2b3350" stroke-width="1"/>
<text x="653.8" y="129" text-anchor="middle" font-size="12" fill="#2b3350" font-weight="bold">Mars</text>
<text x="653.8" y="145" text-anchor="middle" font-size="10" fill="#2b3350">7 years</text>
<text x="607.6" y="170" text-anchor="middle" font-size="10" fill="#2b3350">43</text>
<text x="700" y="170" text-anchor="middle" font-size="10" fill="#2b3350">50</text>
<text x="40" y="96" text-anchor="start" font-size="11" fill="#2b3350">Age, for a person whose first season is Ketu with no balance to subtract</text>
<line x1="356.8" y1="106" x2="356.8" y2="184" stroke="#1e2a5a" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="356.8" cy="106" r="4" fill="#1e2a5a"/>
<text x="60" y="200" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">24</text>
<text x="95" y="200" text-anchor="start" font-size="12" fill="#1e2a5a" font-weight="bold">At 24: the Minister of Pleasure runs the house.</text>
<text x="400" y="200" text-anchor="start" font-size="12" fill="#2b3350">In love, well dressed, saving for nothing.</text>
<line x1="449.2" y1="106" x2="449.2" y2="184" stroke="#1e2a5a" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="449.2" cy="106" r="4" fill="#1e2a5a"/>
<text x="60" y="230" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">31</text>
<text x="95" y="230" text-anchor="start" font-size="12" fill="#1e2a5a" font-weight="bold">At 31: the King runs the house.</text>
<text x="400" y="230" text-anchor="start" font-size="12" fill="#2b3350">Ambitious, visible, arguing with her father.</text>
<line x1="568.0" y1="106" x2="568.0" y2="184" stroke="#1e2a5a" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="568.0" cy="106" r="4" fill="#1e2a5a"/>
<text x="60" y="260" text-anchor="start" font-size="13" fill="#1e2a5a" font-weight="bold">40</text>
<text x="95" y="260" text-anchor="start" font-size="12" fill="#1e2a5a" font-weight="bold">At 40: the Queen Mother runs the house.</text>
<text x="400" y="260" text-anchor="start" font-size="12" fill="#2b3350">Feeding everyone, moody, moving home.</text>
<text x="370.0" y="286" text-anchor="middle" font-size="12" fill="#2b3350" font-style="italic">Three people? No. One person, three courtiers taking turns at the head of the table.</text>
</svg>