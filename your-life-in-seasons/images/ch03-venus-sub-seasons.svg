<line x1="661.5" y1="91" x2="661.5" y2="95" stroke="#2b3350"/>
<text x="700" y="161" text-anchor="middle" font-size="9.5" fill="#2b3350">Jun 2027</text>
<line x1="700" y1="145" x2="700" y2="150" stroke="#2b3350"/>
<line x1="339.2" y1="65" x2="339.2" y2="145" stroke="#1e2a5a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="339.2" y="59" text-anchor="middle" font-size="11" fill="#1e2a5a" font-weight="bold">married, 2016 (Venus/Rahu)</text>
<line x1="678.0" y1="145" x2="678.0" y2="185" stroke="#1e2a5a" stroke-width="1.5"/>
<text x="674.0" y="197" text-anchor="end" font-size="10" fill="#1e2a5a" font-style="italic">now (late 2026): Venus/Ketu, the last sub-season</text>
<text x="370.0" y="230" text-anchor="middle" font-size="11.5" fill="#2b3350">Each sub-season is the Venus season (20 years) multiplied by the sub-lord's own years, divided by 120.</text>
<text x="370.0" y="250" text-anchor="middle" font-size="10.5" fill="#2b3350">Venus 3y 4m · Sun 1y · Moon 1y 8m · Mars 1y 2m · Rahu 3y · Jupiter 2y 8m · Saturn 3y 2m · Mercury 2y 10m · Ketu 1y 2m</text>
<text x="370.0" y="290" text-anchor="middle" font-size="11" fill="#2b3350" font-style="italic">The nine add up to exactly 20 years. The order starts with Venus itself and then follows the fixed order of the seasons.</text>
<text x="370.0" y="316" text-anchor="middle" font-size="10.5" fill="#2b3350" font-style="italic">Dates are approximate (to the month).</text>
</svg>